
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Resultados de búsqueda de tiquetes - Concorde Transporte Terrestre">
  <title>Concorde Transporte Terrestre | Resultados</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="navbar-placeholder"></div>

  <main id="contenido-principal">
    <div class="bg-azul-gradiente text-white py-3">
      <div class="container">
        <nav aria-label="Ruta de navegación">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
              <a href="index.html" class="text-white-50">Inicio</a>
            </li>
            <li class="breadcrumb-item active text-white">Resultados</li>
          </ol>
        </nav>

        <h1 class="h4 mt-2 fw-bold">
          <i class="bi bi-search me-2"></i>
          <span id="rutaBusqueda">Preparando búsqueda...</span>
        </h1>
      </div>
    </div>

    <div class="container py-4">
      <div class="row g-3">

        <!-- FILTROS -->
        <aside class="col-lg-3">
          <div class="card-concorde mb-3">
            <div class="card-header-concorde">
              <i class="bi bi-funnel me-1"></i>Filtros
            </div>

            <div class="card-body">
              <fieldset class="mb-3">
                <legend class="form-label fw-bold">Precio máximo</legend>

                <input
                  type="range"
                  class="form-range"
                  min="10000"
                  max="300000"
                  step="5000"
                  value="300000"
                  id="filtroPrecio"
                >

                <div class="d-flex justify-content-between small text-muted">
                  <span>$10k</span>
                  <span id="valorPrecio" class="fw-bold texto-azul">$300k</span>
                  <span>$300k</span>
                </div>
              </fieldset>

              <fieldset>
                <legend class="form-label fw-bold">Hora de salida</legend>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno1" checked>
                  <label class="form-check-label" for="turno1">🌅 Madrugada (00–06)</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno2" checked>
                  <label class="form-check-label" for="turno2">☀️ Mañana (06–12)</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno3" checked>
                  <label class="form-check-label" for="turno3">🌤️ Tarde (12–18)</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno4" checked>
                  <label class="form-check-label" for="turno4">🌙 Noche (18–00)</label>
                </div>
              </fieldset>
            </div>
          </div>

          <!-- MODIFICAR BÚSQUEDA -->
          <div class="card-concorde">
            <div class="card-header-concorde">
              <i class="bi bi-arrow-repeat me-1"></i>Modificar búsqueda
            </div>

            <div class="card-body">
              <label class="form-label" for="origenFiltro">Origen</label>
              <select class="form-select form-select-sm mb-2" id="origenFiltro"></select>

              <label class="form-label" for="destinoFiltro">Destino</label>
              <select class="form-select form-select-sm mb-3" id="destinoFiltro"></select>

              <button type="button" id="btnModificar" class="btn btn-concorde-primario w-100 btn-sm">
                <i class="bi bi-search me-1"></i>Buscar
              </button>
            </div>
          </div>
        </aside>

        <!-- RESULTADOS -->
        <section class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <p class="mb-0 text-muted">
              <strong class="texto-azul" id="totalTrayectos">0</strong>
              trayectos encontrados
            </p>

            <div class="d-flex align-items-center gap-2">
              <label for="ordenar" class="form-label mb-0 small fw-semibold">Ordenar:</label>

              <select class="form-select form-select-sm" id="ordenar" style="width:auto">
                <option value="precio-asc">Precio menor</option>
                <option value="precio-desc">Precio mayor</option>
                <option value="salida">Salida más temprana</option>
              </select>
            </div>
          </div>

          <div id="listaTrayectos" aria-live="polite">
            <div class="alert alert-secondary">Preparando búsqueda...</div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/main.js"></script>

  <script>
  (() => {
    'use strict';

    const NOMBRES = {
      AGUAZUL: 'Aguazul',
      BARRANQUILLA: 'Barranquilla',
      BOGOTA_NORTE: 'Bogotá Norte',
      BOGOTA_SALITRE: 'Bogotá Salitre',
      BUCARAMANGA: 'Bucaramanga',
      CARTAGENA: 'Cartagena',
      CUCUTA: 'Cúcuta',
      DUITAMA: 'Duitama',
      ONZAGA: 'Onzaga',
      PAIPA: 'Paipa',
      PAMPLONA: 'Pamplona',
      SOGAMOSO: 'Sogamoso',
      TUNJA: 'Tunja',
      YOPAL: 'Yopal'
    };

    const API_TIMEOUT = 15000;
    const params = new URLSearchParams(window.location.search);

    let origen = params.get('origen') || 'TUNJA';
    let destino = params.get('destino') || 'BOGOTA_SALITRE';
    let pasajeros = Math.max(1, parseInt(params.get('pasajeros'), 10) || 1);
    let ida = params.get('ida') || fechaActual();
    let TRAYECTOS = [];

    const contenedor = document.getElementById('listaTrayectos');
    const total = document.getElementById('totalTrayectos');
    const slider = document.getElementById('filtroPrecio');
    const valorPrecio = document.getElementById('valorPrecio');
    const ordenar = document.getElementById('ordenar');

    const turnos = [1, 2, 3, 4].map(n =>
      document.getElementById('turno' + n)
    );

    function fechaActual() {
      const d = new Date();
      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, '0'),
        String(d.getDate()).padStart(2, '0')
      ].join('-');
    }

    function formatoFecha(fecha) {
      const d = new Date(fecha + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return fecha;

      return d.toLocaleDateString('es-CO', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
    }

    function escapar(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[c]);
    }

    function nombreCiudad(valor) {
      if (!valor) return '';
      return NOMBRES[String(valor).toUpperCase()] || valor;
    }

    function obtenerAPI() {
      let base = '';

      if (typeof AUTH_API !== 'undefined' && AUTH_API) {
        base = AUTH_API;
      } else {
        base = '/api';
      }

      return String(base).replace(/\/+$/, '');
    }

    function turnoDe(hora) {
      const h = parseInt(String(hora || '00:00').split(':')[0], 10);

      if (Number.isNaN(h)) return 0;
      if (h < 6) return 0;
      if (h < 12) return 1;
      if (h < 18) return 2;
      return 3;
    }

    function normalizarRespuesta(data) {
      if (Array.isArray(data)) return data;

      if (data && Array.isArray(data.content)) return data.content;
      if (data && Array.isArray(data.data)) return data.data;
      if (data && Array.isArray(data.viajes)) return data.viajes;
      if (data && Array.isArray(data.resultados)) return data.resultados;

      throw new Error('El servidor devolvió un formato de respuesta inesperado.');
    }

    function normalizarViaje(t, indice) {
      const salida = t.salida || t.horaSalida || t.hora_salida || '00:00';

      return {
        idViaje: t.idViaje ?? t.id ?? t.viajeId ?? '',
        salida: String(salida).substring(0, 5),
        precio: Number(t.precio ?? t.precioBase ?? t.tarifa ?? 0),
        terminalOrigen: t.terminalOrigen || t.origen || nombreCiudad(origen),
        terminalDestino: t.terminalDestino || t.destino || nombreCiudad(destino),
        duracion: t.duracion || t.tiempoDuracion || '',
        clase: t.clase || t.tipoServicio || '',
        indice
      };
    }

    function actualizarTitulo() {
      document.getElementById('rutaBusqueda').textContent =
        nombreCiudad(origen) + ' → ' + nombreCiudad(destino) +
        ' · ' + formatoFecha(ida) +
        ' · ' + pasajeros + (pasajeros === 1 ? ' pasajero' : ' pasajeros');
    }

    function dibujar() {
      const maxPrecio = Number(slider.value);

      let lista = TRAYECTOS.filter(t => {
        return t.precio <= maxPrecio &&
          turnos[turnoDe(t.salida)].checked;
      });

      lista.sort((a, b) => {
        if (ordenar.value === 'precio-desc') return b.precio - a.precio;
        if (ordenar.value === 'salida') return a.salida.localeCompare(b.salida);
        return a.precio - b.precio;
      });

      total.textContent = lista.length;

      if (!lista.length) {
        contenedor.innerHTML = `
          <div class="alert alert-info">
            No encontramos trayectos con los filtros seleccionados.
            Intenta cambiar la hora o el precio máximo.
          </div>`;
        return;
      }

      contenedor.innerHTML = lista.map(t => {
        const precio = t.precio.toLocaleString('es-CO');
        const url = new URL('p05-detalle-viaje.html', window.location.href);

        url.search = new URLSearchParams({
          origen,
          destino,
          ida,
          pasajeros: String(pasajeros),
          idViaje: String(t.idViaje),
          salida: t.salida,
          precio: String(t.precio),
          terminalOrigen: String(t.terminalOrigen),
          terminalDestino: String(t.terminalDestino),
          duracion: String(t.duracion)
        }).toString();

        return `
          <article class="card-vuelo fade-in-up visible mb-3">
            <div class="row align-items-center g-3 p-2">
              <div class="col-md-3">
                <div class="hora">${escapar(t.salida)}</div>
                <div class="ciudad">${escapar(t.terminalOrigen)}</div>
                <div class="small text-muted">Origen</div>
              </div>

              <div class="col-md-3 text-center">
                <i class="bi bi-bus-front fs-3 texto-azul"></i>
                <div class="small text-muted">${escapar(t.duracion || 'Trayecto terrestre')}</div>
                <div class="small">${escapar(formatoFecha(ida))}</div>
              </div>

              <div class="col-md-3">
                <div class="ciudad">${escapar(t.terminalDestino)}</div>
                <div class="small text-muted">Destino</div>
                <div class="small text-muted">Concorde</div>
              </div>

              <div class="col-md-3 text-md-end">
                <div class="precio">$${precio}<small>/persona</small></div>
                <a href="${escapar(url.href)}"
                   class="btn btn-concorde-primario btn-sm px-3 mt-2">
                  Seleccionar <i class="bi bi-arrow-right"></i>
                </a>
              </div>
            </div>
          </article>`;
      }).join('');
    }

    async function cargar() {
      contenedor.innerHTML = `
        <div class="alert alert-secondary">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Consultando trayectos disponibles...
        </div>`;

      total.textContent = '...';

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), API_TIMEOUT);

      try {
        const q = new URLSearchParams({
          origen: nombreCiudad(origen),
          destino: nombreCiudad(destino),
          fecha: ida
        });

        const url = obtenerAPI() + '/viajes/disponibles?' + q.toString();

        const res = await fetch(url, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          signal: controller.signal
        });

        if (!res.ok) {
          throw new Error('El servidor respondió HTTP ' + res.status);
        }

        const data = await res.json();
        const viajes = normalizarRespuesta(data);

        TRAYECTOS = viajes
          .map(normalizarViaje)
          .filter(t => t.idViaje !== '' && Number.isFinite(t.precio) && t.precio > 0);

        if (!TRAYECTOS.length) {
          total.textContent = '0';
          contenedor.innerHTML = `
            <div class="alert alert-info">
              No hay trayectos disponibles para esta ruta y fecha.
              Puedes modificar la búsqueda para intentarlo nuevamente.
            </div>`;
          return;
        }

        dibujar();

      } catch (error) {
        console.error('Error consultando viajes:', error);

        total.textContent = '0';

        const mensaje = error.name === 'AbortError'
          ? 'La consulta tardó demasiado. Comprueba tu conexión e inténtalo nuevamente.'
          : error.message || 'No fue posible consultar los trayectos.';

        contenedor.innerHTML = `
          <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle me-2"></i>
            ${escapar(mensaje)}
            <button class="btn btn-outline-danger btn-sm ms-2"
                    type="button" id="btnReintentar">
              Reintentar
            </button>
          </div>`;

        document.getElementById('btnReintentar')
          .addEventListener('click', cargar);

      } finally {
        clearTimeout(timeout);
      }
    }

    slider.addEventListener('input', () => {
      valorPrecio.textContent =
        '$' + Math.round(Number(slider.value) / 1000) + 'k';
      dibujar();
    });

    turnos.forEach(el => el.addEventListener('change', dibujar));
    ordenar.addEventListener('change', dibujar);

    const selO = document.getElementById('origenFiltro');
    const selD = document.getElementById('destinoFiltro');

    const opciones = Object.entries(NOMBRES).map(([codigo, nombre]) =>
      `<option value="${codigo}">${escapar(nombre)}</option>`
    ).join('');

    selO.innerHTML = opciones;
    selD.innerHTML = opciones;
    selO.value = origen;
    selD.value = destino;

    document.getElementById('btnModificar').addEventListener('click', () => {
      if (selO.value === selD.value) {
        if (typeof UI !== 'undefined' && UI.mostrarToast) {
          UI.mostrarToast('El origen y el destino deben ser distintos', 'warning');
        } else {
          alert('El origen y el destino deben ser distintos.');
        }
        return;
      }

      params.set('origen', selO.value);
      params.set('destino', selD.value);

      window.location.href = 'p02-resultados.html?' + params.toString();
    });

    actualizarTitulo();
    cargar();

  })();
  </script>

  <script src="js/aviso-agotados.js"></script>
</body>
</html>
