<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Resultados de búsqueda de tiquetes - Concorde Transporte Terrestre">
  <title>Concorde Transporte Terrestre | Resultados</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main id="contenido-principal">
    <div class="bg-azul-gradiente text-white py-3">
      <div class="container">
        <nav aria-label="Ruta de navegación">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="index.html" class="text-white-50">Inicio</a></li>
            <li class="breadcrumb-item active text-white" aria-current="page">Resultados</li>
          </ol>
        </nav>
        <h1 class="h4 mt-2 fw-bold">
          <i class="bi bi-search me-2" aria-hidden="true"></i>
          <span id="rutaBusqueda">Cargando búsqueda...</span>
        </h1>
      </div>
    </div>

    <div class="container py-4">
      <div class="row g-3">

        <!-- FILTROS -->
        <aside class="col-lg-3" aria-label="Filtros de búsqueda">
          <div class="card-concorde mb-3">
            <div class="card-header-concorde">
              <i class="bi bi-funnel me-1" aria-hidden="true"></i>Filtros
            </div>
            <div class="card-body">

              <!-- Precio -->
              <fieldset class="mb-3">
                <legend class="form-label fw-bold">Precio máximo</legend>
                <input type="range" class="form-range" min="10000" max="150000"
                  step="5000" value="80000" id="filtroPrecio" data-filtro
                  aria-label="Filtrar por precio máximo">
                <div class="d-flex justify-content-between small text-muted">
                  <span>$10k</span>
                  <span id="valorPrecio" class="fw-bold texto-azul">$80k</span>
                  <span>$150k</span>
                </div>
              </fieldset>

              <!-- Hora de salida -->
              <fieldset class="mb-3">
                <legend class="form-label fw-bold">Hora de salida</legend>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno1" checked data-filtro>
                  <label class="form-check-label" for="turno1">🌅 Madrugada (00–06)</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno2" checked data-filtro>
                  <label class="form-check-label" for="turno2">☀️ Mañana (06–12)</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno3" checked data-filtro>
                  <label class="form-check-label" for="turno3">🌤️ Tarde (12–18)</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno4" checked data-filtro>
                  <label class="form-check-label" for="turno4">🌙 Noche (18–00)</label>
                </div>
              </fieldset>

              <!-- Clase de servicio -->
              <fieldset>
                <legend class="form-label fw-bold">Tipo de servicio</legend>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="claseEconomica" checked data-filtro>
                  <label class="form-check-label" for="claseEconomica">Económico</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="clasePremium" checked data-filtro>
                  <label class="form-check-label" for="clasePremium">Premium</label>
                </div>
              </fieldset>
            </div>
          </div>

          <!-- Mini buscador rápido (las ciudades se llenan por JS) -->
          <div class="card-concorde">
            <div class="card-header-concorde">
              <i class="bi bi-arrow-repeat me-1" aria-hidden="true"></i>Modificar búsqueda
            </div>
            <div class="card-body">
              <div class="form-concorde">
                <label class="form-label" for="origenFiltro">Origen</label>
                <select class="form-select form-select-sm mb-2" id="origenFiltro" aria-label="Cambiar ciudad de origen"></select>
                <label class="form-label" for="destinoFiltro">Destino</label>
                <select class="form-select form-select-sm mb-3" id="destinoFiltro" aria-label="Cambiar ciudad de destino"></select>
                <button type="button" id="btnModificar" class="btn btn-concorde-primario w-100 btn-sm">
                  <i class="bi bi-search me-1"></i>Buscar
                </button>
              </div>
            </div>
          </div>
        </aside>

        <!-- RESULTADOS -->
        <section class="col-lg-9" aria-label="Lista de trayectos disponibles">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <p class="mb-0 text-muted">
              <strong class="texto-azul" id="totalTrayectos">0</strong> trayectos encontrados
            </p>
            <div class="d-flex align-items-center gap-2">
              <label for="ordenar" class="form-label mb-0 small fw-semibold">Ordenar por:</label>
              <select class="form-select form-select-sm" id="ordenar" style="width:auto" aria-label="Ordenar resultados">
                <option value="precio-asc">Precio (menor)</option>
                <option value="precio-desc">Precio (mayor)</option>
                <option value="duracion">Duración</option>
                <option value="salida">Salida más temprana</option>
              </select>
            </div>
          </div>

          <!-- Aquí JS dibuja los trayectos -->
          <div id="listaTrayectos"></div>
        </section>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/main.js"></script>
  <script>
  (function () {
    const NOMBRES = {
      AGUAZUL: 'Aguazul', BARRANQUILLA: 'Barranquilla', BOGOTA_NORTE: 'Bogotá Norte',
      BOGOTA_SALITRE: 'Bogotá Salitre', BUCARAMANGA: 'Bucaramanga', CARTAGENA: 'Cartagena',
      CUCUTA: 'Cúcuta', DUITAMA: 'Duitama', ONZAGA: 'Onzaga', PAIPA: 'Paipa',
      PAMPLONA: 'Pamplona', SOGAMOSO: 'Sogamoso', TUNJA: 'Tunja', YOPAL: 'Yopal'
    };

    // TEMPORAL: datos fijos (los mismos 5 trayectos que tenías en el HTML).
    // Cuando el backend tenga el endpoint, se reemplaza este arreglo por un fetch.
    const TRAYECTOS = [
      { origen: 'TUNJA', destino: 'BOGOTA_SALITRE', salida: '05:30', llegada: '09:00', bus: 'Ejecutivo Plus', dur: '3h 30min · Directo', min: 210, clase: 'Económico', precio: 22000, asientos: 28 },
      { origen: 'TUNJA', destino: 'BOGOTA_SALITRE', salida: '07:00', llegada: '10:20', bus: 'Premium Plus', dur: '3h 20min · Directo', min: 200, clase: 'Premium', precio: 28000, asientos: 12 },
      { origen: 'TUNJA', destino: 'BOGOTA_SALITRE', salida: '09:30', llegada: '13:40', bus: 'Regular', dur: '4h 10min · Parada en Zipaquirá', min: 250, clase: 'Económico', precio: 18000, asientos: 35 },
      { origen: 'TUNJA', destino: 'BOGOTA_SALITRE', salida: '14:00', llegada: '17:30', bus: 'Ejecutivo Plus', dur: '3h 30min · Directo', min: 210, clase: 'Económico', precio: 25000, asientos: 20 },
      { origen: 'TUNJA', destino: 'BOGOTA_SALITRE', salida: '22:00', llegada: '01:30', bus: 'Noche Premium', dur: '3h 30min · Directo', min: 210, clase: 'Premium', precio: 32000, asientos: 8 }
    ];

    // --- Parámetros de la búsqueda (vienen de la URL) ---
    const params = new URLSearchParams(location.search);
    const origen = params.get('origen') || 'TUNJA';
    const destino = params.get('destino') || 'BOGOTA_SALITRE';
    const pasajeros = parseInt(params.get('pasajeros')) || 1;
    const ida = params.get('ida');
    const fecha = ida
      ? new Date(ida + 'T00:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'short' })
      : '';

    document.getElementById('rutaBusqueda').textContent =
      (NOMBRES[origen] || origen) + ' → ' + (NOMBRES[destino] || destino) +
      (fecha ? ' · ' + fecha : '') + ' · ' + pasajeros + ' pasajero' + (pasajeros > 1 ? 's' : '');

    const contenedor = document.getElementById('listaTrayectos');
    const total = document.getElementById('totalTrayectos');
    const slider = document.getElementById('filtroPrecio');
    const valorPrecio = document.getElementById('valorPrecio');
    const ordenar = document.getElementById('ordenar');
    const turnos = [
      document.getElementById('turno1'), document.getElementById('turno2'),
      document.getElementById('turno3'), document.getElementById('turno4')
    ];
    const claseEco = document.getElementById('claseEconomica');
    const clasePre = document.getElementById('clasePremium');

    function turnoDe(hora) {
      const h = parseInt(hora.split(':')[0], 10);
      if (h < 6) return 0;
      if (h < 12) return 1;
      if (h < 18) return 2;
      return 3;
    }

    function dibujar() {
      const maxPrecio = parseInt(slider.value, 10);
      let lista = TRAYECTOS.filter(function (t) {
        return t.origen === origen && t.destino === destino &&
               t.precio <= maxPrecio &&
               turnos[turnoDe(t.salida)].checked &&
               (t.clase === 'Premium' ? clasePre.checked : claseEco.checked);
      });

      const orden = ordenar.value;
      lista.sort(function (a, b) {
        if (orden === 'precio-desc') return b.precio - a.precio;
        if (orden === 'duracion') return a.min - b.min;
        if (orden === 'salida') return a.salida.localeCompare(b.salida);
        return a.precio - b.precio;
      });

      total.textContent = lista.length;

      if (!lista.length) {
        contenedor.innerHTML =
          '<div class="alert alert-info">No hay trayectos disponibles de ' +
          (NOMBRES[origen] || origen) + ' a ' + (NOMBRES[destino] || destino) +
          ' con estos filtros. Prueba con otra ruta o ajusta los filtros.</div>';
        return;
      }

      const enlace = 'p05-detalle-viaje.html?' + params.toString();
      contenedor.innerHTML = lista.map(function (t) {
        const premium = t.clase === 'Premium';
        return '' +
          '<article class="card-vuelo fade-in-up visible" aria-label="Bus a las ' + t.salida + ', precio $' + t.precio.toLocaleString('es-CO') + '">' +
            '<div class="row align-items-center g-2">' +
              '<div class="col-md-3">' +
                '<div class="hora">' + t.salida + '</div>' +
                '<div class="ciudad">' + NOMBRES[t.origen] + ' · Terminal</div>' +
                '<div class="small text-muted">Bus 🚌 ' + t.bus + '</div>' +
              '</div>' +
              '<div class="col-md-3 text-center">' +
                '<div class="linea-vuelo justify-content-center" aria-hidden="true"><span class="avion-icono">🚌</span></div>' +
                '<small class="text-muted d-block">' + t.dur + '</small>' +
                '<span class="badge-clase ' + (premium ? 'badge-ejecutiva' : 'badge-economica') + '">' + t.clase + '</span>' +
              '</div>' +
              '<div class="col-md-3">' +
                '<div class="hora">' + t.llegada + '</div>' +
                '<div class="ciudad">' + NOMBRES[t.destino] + '</div>' +
                '<div class="small text-muted">Terminal ' + NOMBRES[t.destino] + '</div>' +
              '</div>' +
              '<div class="col-md-3 text-end">' +
                '<div class="precio">$' + t.precio.toLocaleString('es-CO') + '<small>/persona</small></div>' +
                '<div class="small text-muted mb-2">Asientos disponibles: ' + t.asientos + '</div>' +
                '<a href="' + enlace + '" class="btn btn-concorde-primario btn-sm px-3">Seleccionar</a>' +
              '</div>' +
            '</div>' +
          '</article>';
      }).join('');
    }

    // --- Filtros y orden ---
    slider.addEventListener('input', function () {
      valorPrecio.textContent = '$' + (parseInt(slider.value, 10) / 1000) + 'k';
      dibujar();
    });
    turnos.concat([claseEco, clasePre]).forEach(function (el) { el.addEventListener('change', dibujar); });
    ordenar.addEventListener('change', dibujar);

    // --- "Modificar búsqueda" ---
    const selO = document.getElementById('origenFiltro');
    const selD = document.getElementById('destinoFiltro');
    const opciones = Object.keys(NOMBRES).map(function (k) {
      return '<option value="' + k + '">' + NOMBRES[k] + '</option>';
    }).join('');
    selO.innerHTML = opciones;
    selD.innerHTML = opciones;
    selO.value = origen;
    selD.value = destino;

    document.getElementById('btnModificar').addEventListener('click', function () {
      if (selO.value === selD.value) {
        UI.mostrarToast('El origen y el destino deben ser distintos', 'warning');
        return;
      }
      params.set('origen', selO.value);
      params.set('destino', selD.value);
      location.search = params.toString();
    });

    dibujar();
  })();
  </script>
  <script src="js/aviso-agotados.js"></script>
</body>
</html>
