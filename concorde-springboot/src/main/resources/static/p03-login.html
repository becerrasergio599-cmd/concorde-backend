<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Iniciar sesión en Concorde Transporte Terrestre">
  <title>Concorde Transporte Terrestre | Iniciar Sesión</title>
  <link rel="icon" type="image/png" href="img/LogoConcorde.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul-principal) 60%, var(--azul-claro) 100%);
      padding: 2rem 0;
      position: relative;
      overflow: hidden;
    }
    .login-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M40 0L0 40l40 40 40-40z'/%3E%3C/g%3E%3C/svg%3E");
    }
    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, var(--azul-oscuro), var(--azul-claro));
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .login-avion {
      font-size: 3rem;
      display: block;
      animation: flotarAvion 3s ease-in-out infinite;
    }
    @keyframes flotarAvion {
      0%,100% { transform: translateY(0) rotate(-5deg); }
      50%      { transform: translateY(-10px) rotate(5deg); }
    }
    .credenciales-demo {
      background: rgba(0,53,128,0.05);
      border: 1px dashed rgba(0,53,128,0.2);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin-bottom: 1.2rem;
    }
    .credenciales-demo .btn-credencial {
      cursor: pointer;
      transition: all .2s;
      border-radius: 8px;
      border: 1px solid rgba(0,53,128,0.15);
      background: white;
      padding: .45rem .8rem;
      font-size: .82rem;
      width: 100%;
      text-align: left;
    }
    .credenciales-demo .btn-credencial:hover { background: var(--azul-principal); color: white; }
    .shake { animation: shake .4s; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }
  </style>
</head>
<body>

<main id="contenido-principal" class="login-wrapper">
  <div class="container position-relative">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7 col-sm-10">

        <div class="login-card">
          <!-- Header -->
          <div class="login-header">
            <span class="login-avion" aria-hidden="true">✈</span>
            <h1 class="h4 fw-bold mt-2 mb-0">Concorde Transporte Terrestre</h1>
            <p class="opacity-75 small mb-0">Inicia sesión para continuar</p>
          </div>

          <!-- Body -->
          <div class="p-4">

            <!-- Formulario -->
            <form id="formLogin" class="form-concorde" novalidate aria-label="Formulario de inicio de sesión">

              <div class="mb-3">
                <label class="form-label" for="emailLogin">
                  <i class="bi bi-envelope me-1" aria-hidden="true"></i>Correo electrónico
                </label>
                <input type="email" class="form-control" id="emailLogin"
                  placeholder="correo@concorde.co" required aria-required="true" autocomplete="email">
                <div class="invalid-feedback">Ingresa un correo válido</div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="passwordLogin">
                  <i class="bi bi-lock me-1" aria-hidden="true"></i>Contraseña
                </label>
                <div class="input-group">
                  <input type="password" class="form-control" id="passwordLogin"
                    placeholder="Tu contraseña" required aria-required="true" autocomplete="current-password">
                  <button class="btn btn-outline-secondary" type="button" id="togglePass"
                    aria-label="Mostrar u ocultar contraseña">
                    <i class="bi bi-eye" id="iconoOjo" aria-hidden="true"></i>
                  </button>
                </div>
                <div class="invalid-feedback">Ingresa tu contraseña</div>
              </div>

              <!-- Error message -->
              <div id="errorLogin" class="alert alert-danger d-none py-2 small" role="alert" aria-live="polite">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span id="textoError">Correo o contraseña incorrectos.</span>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input type="checkbox" class="form-abordajeput" id="recordarme">
                  <label class="form-check-label small" for="recordarme">Recordarme</label>
                </div>
                <a href="p13-recuperar.html" class="small">¿Olvidaste tu contraseña?</a>
              </div>

              <button type="submit" class="btn btn-concorde-primario w-100 py-2 mb-3" id="btnLogin">
                <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Iniciar Sesión
              </button>
            </form>

            <div class="text-center border-top pt-3">
              <span class="text-muted small">¿No tienes cuenta?</span>
              <a href="p04-registro.html" class="fw-bold ms-1 small">Regístrate gratis</a>
            </div>
          </div>
        </div>

        <!-- Info credenciales debajo de la card -->
        <div class="text-center mt-3 text-white opacity-75">
          <small><i class="bi bi-info-circle me-1"></i>Proyecto SENA — Ficha 3171149-B</small>
        </div>

      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script>
  // Si ya está logueado, redirigir
  Auth.redirigirSiLogueado();

  // Toggle contraseña
  document.getElementById('togglePass').addEventListener('click', () => {
    const inp = document.getElementById('passwordLogin');
    const ico = document.getElementById('iconoOjo');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    ico.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    document.getElementById('togglePass').setAttribute('aria-label', inp.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña');
  });

  // Submit
  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('emailLogin').value.trim();
    const password = document.getElementById('passwordLogin').value;
    const errorDiv = document.getElementById('errorLogin');
    const btn      = document.getElementById('btnLogin');

    // Loading
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verificando...';
    errorDiv.classList.add('d-none');

    const user = await Auth.login(email, password);

    if (user) {
      btn.innerHTML = '<i class="bi bi-check-circle me-1"></i>¡Bienvenido, ' + user.nombre.split(' ')[0] + '!';
      btn.classList.replace('btn-concorde-primario', 'btn-success');
      setTimeout(() => {
        window.location.href = paginaSegunRol(user.rol);
      }, 600);
    } else {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión';
      document.getElementById('textoError').textContent = 'Correo o contraseña incorrectos, o no se pudo conectar con el servidor.';
      errorDiv.classList.remove('d-none');
      document.getElementById('formLogin').classList.add('shake');
      setTimeout(() => document.getElementById('formLogin').classList.remove('shake'), 400);
      document.getElementById('passwordLogin').value = '';
      document.getElementById('passwordLogin').focus();
    }
  });
</script>
</body>
</html>
