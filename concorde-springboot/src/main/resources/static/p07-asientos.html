
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selección de asientos - Concorde Transporte Terrestre">
  <title>Concorde | Selección de Asientos</title>

  <link rel="icon" type="image/png" href="img/LogoConcorde.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    .bus-body {
      background: var(--gris-claro, #f3f5f8);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 340px;
      margin: 0 auto;
      border: 2px solid var(--gris-medio, #dce1e7);
    }

    .bus-frente {
      background: linear-gradient(135deg, #003580, #0863c4);
      border-radius: 12px 12px 4px 4px;
      padding: .7rem;
      text-align: center;
      color: white;
      font-size: .75rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .fila-bus {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 5px;
    }

    .num-fila {
      width: 22px;
      font-size: .6rem;
      color: #777;
      text-align: center;
      flex-shrink: 0;
    }

    .pasillo-bus {
      width: 18px;
      flex-shrink: 0;
    }

    .asiento-bus {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 6px 6px 4px 4px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all .2s;
      font-size: .62rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .asiento-bus::before {
      content: "";
      position: absolute;
      top: 0;
      left: 2px;
      right: 2px;
      height: 6px;
      background: rgba(0, 0, 0, .1);
      border-radius: 3px 3px 0 0;
    }

    /* VERDE: ASIENTO DISPONIBLE */
    .asiento-libre {
      background: #e8f4ea;
      border-color: #28a745;
      color: #155724;
    }

    .asiento-libre:hover {
      background: #28a745;
      color: white;
      transform: scale(1.07);
    }

    /* ROJO: ASIENTO OCUPADO REALMENTE */
    .asiento-ocupado,
    .asiento-ocupado:hover {
      background: #f8d7da !important;
      border-color: #dc3545 !important;
      color: #721c24 !important;
      cursor: not-allowed !important;
      transform: none !important;
      opacity: 1 !important;
    }

    /* NARANJA CLARO: ASIENTO PREMIUM */
    .asiento-premium {
      background: #fff2d8;
      border-color: #f5a623;
      color: #a76b00;
    }

    .asiento-premium:hover {
      background: #f5a623;
      color: white;
      transform: scale(1.07);
    }

    /* NARANJA FUERTE: ASIENTO SELECCIONADO */
    .asiento-seleccionado,
    .asiento-seleccionado:hover {
      background: #f5a623 !important;
      border-color: #d68a00 !important;
      color: #003580 !important;
      transform: scale(1.07);
      box-shadow: 0 3px 10px rgba(245, 166, 35, .4);
    }

    /* PREMIUM BLOQUEADO PARA TARIFA ECONÓMICA */
    .asiento-bloqueado {
      opacity: .45;
      cursor: not-allowed;
    }

    .asiento-bloqueado:hover {
      transform: none;
      background: #fff2d8;
      color: #a76b00;
    }

    .bus-trasero {
      background: #dce1e7;
      border-radius: 4px 4px 12px 12px;
      padding: 5px;
      margin-top: .8rem;
      display: flex;
      justify-content: center;
      gap: 4px;
    }

    #listaTabsTramo .nav-link {
      color: #003580;
      font-weight: 600;
    }

    #listaTabsTramo .nav-link.active {
      background: #003580;
      color: white;
    }

    /* Leyenda alineada en dos columnas, también en Android WebView */
    .leyenda-concorde {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 12px;
      row-gap: 12px;
      max-width: 330px;
      margin-left: auto;
      margin-right: auto;
      align-items: center;
    }

    .leyenda-concorde .leyenda-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      min-width: 0;
      white-space: nowrap;
    }

    .leyenda-concorde .leyenda-asiento {
      flex: 0 0 22px;
      box-sizing: border-box;
    }

    .leyenda-concorde .leyenda-item small {
      font-size: clamp(11px, 3vw, 14px);
      line-height: 1.2;
    }

    .leyenda-asiento {
      width: 22px;
      height: 22px;
      display: inline-block;
      border-radius: 4px;
      border: 2px solid;
      vertical-align: middle;
    }

    .leyenda-libre {
      background: #e8f4ea;
      border-color: #28a745;
    }

    .leyenda-ocupado {
      background: #f8d7da;
      border-color: #dc3545;
    }

    .leyenda-seleccionado {
      background: #f5a623;
      border-color: #d68a00;
    }

    .leyenda-premium {
      background: #fff2d8;
      border-color: #f5a623;
    }
  </style>
</head>

<script>
(function () {

  const $ = id => document.getElementById(id);

  // ==========================================
  // FUNCIONES AUXILIARES
  // ==========================================

  function leer(clave) {
    try {
      return JSON.parse(
        sessionStorage.getItem(clave) || 'null'
      );
    } catch {
      return null;
    }
  }

  function normalizar(valor) {
    return String(valor ?? '').trim().toUpperCase();
  }

  function esc(valor) {
    return String(valor ?? '').replace(
      /[&<>"']/g,
      c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c])
    );
  }

  function avisar(mensaje, tipo = 'warning') {
    if (
      window.UI &&
      typeof UI.mostrarToast === 'function'
    ) {
      UI.mostrarToast(mensaje, tipo);
    } else {
      console.warn(mensaje);
    }
  }

  // ==========================================
  // CONFIGURACIÓN PREMIUM
  // ==========================================

  // ARREGLO:
  // TODA LA PRIMERA Y SEGUNDA FILA ES PREMIUM.
  //
  // INCLUYE EL ASIENTO 2B.
  //
  // 1A  1B  |  1C  1D
  // 2A  2B  |  2C  2D
  //
  // También se respetan los demás asientos
  // PREMIUM registrados en PostgreSQL.

  const PRIMEROS_ASIENTOS_PREMIUM = new Set([
    '1A',
    '1B',
    '1C',
    '1D',
    '2A',
    '2B',
    '2C',
    '2D'
  ]);

  // ==========================================
  // DATOS DEL VIAJE
  // ==========================================

  const viajeIda =
    leer('concorde_viaje') || {};

  const viajeVuelta =
    leer('concorde_viaje_vuelta');

  const tramos = viajeVuelta
    ? ['ida', 'vuelta']
    : ['ida'];

  const VIAJE = {
    ida: viajeIda,
    vuelta: viajeVuelta || {}
  };

  const CLAVES = {
    ida: 'concorde_asientos',
    vuelta: 'concorde_asientos_vuelta'
  };

  const seleccionados = {
    ida: [],
    vuelta: []
  };

  const mapas = {
    ida: new Map(),
    vuelta: new Map()
  };

  let tramoActual = 'ida';
  let cargado = false;

  function obtenerIdViaje(viaje) {
    return Number(
      viaje?.idViaje ||
      viaje?.viaje?.idViaje ||
      0
    );
  }

  // ==========================================
  // IDENTIFICAR LA TARIFA ELEGIDA
  // ==========================================

  function obtenerClase() {

    const candidatos = [
      viajeIda.clase,
      viajeIda.tarifa,
      viajeIda.tipoTarifa,
      viajeIda.claseTarifa,
      viajeIda.tipo,
      sessionStorage.getItem('concorde_clase'),
      sessionStorage.getItem('concorde_tarifa'),
      sessionStorage.getItem('concorde_tipo_tarifa')
    ];

    for (const candidato of candidatos) {

      if (typeof candidato !== 'string') {
        continue;
      }

      const valor = normalizar(candidato);

      if (valor.includes('PREMIUM')) {
        return 'PREMIUM';
      }

      if (valor.includes('ECON')) {
        return 'ECONOMICA';
      }

    }

    return null;
  }

  const CLASE = obtenerClase();

  // ==========================================
  // CANTIDAD DE PASAJEROS
  // ==========================================

  function obtenerPasajeros() {

    const params = new URLSearchParams(
      location.search
    );

    const candidatos = [
      viajeIda.pasajeros,
      viajeIda.numPasajeros,
      viajeIda.numeroPasajeros,
      viajeIda.cantidad,
      viajeIda.cantidadPasajeros,
      params.get('pasajeros'),
      params.get('numPasajeros'),
      sessionStorage.getItem('concorde_num_pasajeros')
    ];

    for (const candidato of candidatos) {

      const numero = parseInt(candidato, 10);

      if (numero > 0) {
        return numero;
      }

    }

    const pasajeros = leer('concorde_pasajeros');

    if (
      Array.isArray(pasajeros) &&
      pasajeros.length
    ) {
      return pasajeros.length;
    }

    return 1;
  }

  const NUM_PASAJEROS = obtenerPasajeros();

  $('busBody').dataset.pasajeros = NUM_PASAJEROS;

  const pasajerosGuardados =
    leer('concorde_pasajeros') || [];

  function completo(tramo) {
    return seleccionados[tramo].length === NUM_PASAJEROS;
  }

  function etiquetaTramo(tramo) {
    return tramo === 'ida' ? 'Ida' : 'Vuelta';
  }

  function nombreRuta(viaje) {
    return (
      viaje.terminalOrigen ||
      viaje.origen ||
      '—'
    ) + ' → ' + (
      viaje.terminalDestino ||
      viaje.destino ||
      '—'
    );
  }

  // ==========================================
  // CONSULTAR ASIENTOS REALES DEL BACKEND
  // ==========================================

  async function cargarAsientos(tramo) {

    const viaje = VIAJE[tramo];

    const idViaje = obtenerIdViaje(viaje);

    if (!idViaje) {
      throw new Error(
        'No se encontró el ID del viaje de ' + tramo
      );
    }

    const respuesta = await fetch(
      `/api/asientos/viaje/${idViaje}`,
      {
        method: 'GET',
        cache: 'no-store'
      }
    );

    if (!respuesta.ok) {
      throw new Error(
        `Error HTTP ${respuesta.status} al consultar los asientos`
      );
    }

    const datos = await respuesta.json();

    if (!Array.isArray(datos)) {
      throw new Error(
        'El servidor no devolvió una lista de asientos'
      );
    }

    if (!datos.length) {
      throw new Error(
        'Este vehículo no tiene asientos registrados'
      );
    }

    const mapa = new Map();

    datos.forEach(a => {

      const numero = normalizar(
        a.numeroAsiento
      );

      if (!numero) return;

      mapa.set(numero, {
        idAsiento: a.idAsiento,
        numeroAsiento: numero,

        tipo: normalizar(
          a.tipo || 'ESTANDAR'
        ),

        disponible: a.disponible === true,

        ocupado: a.ocupado === true
      });

    });

    mapas[tramo] = mapa;

    console.log(
      'Asientos cargados:',
      tramo,
      idViaje,
      [...mapa.values()]
    );
  }

  // ==========================================
  // DISPONIBILIDAD REAL
  // ==========================================

  function estaOcupado(numero, tramo = tramoActual) {

    const asiento = mapas[tramo].get(numero);

    if (!asiento) {
      return true;
    }

    return (
      asiento.ocupado === true ||
      asiento.disponible === false
    );
  }

  // ==========================================
  // IDENTIFICAR PREMIUM
  // ==========================================

  function esPremium(numero, tramo = tramoActual) {

    const asiento = mapas[tramo].get(numero);

    if (!asiento) {
      return false;
    }

    // PRIMERA Y SEGUNDA FILA:
    // 1A, 1B, 1C, 1D
    // 2A, 2B, 2C, 2D
    //
    // TODOS SE PINTAN PREMIUM.

    if (
      PRIMEROS_ASIENTOS_PREMIUM.has(
        normalizar(numero)
      )
    ) {
      return true;
    }

    // TAMBIÉN RESPETAR LOS PREMIUM
    // QUE YA EXISTEN EN LA BASE DE DATOS.

    return asiento.tipo === 'PREMIUM';
  }

  // ==========================================
  // RESTRICCIÓN POR TARIFA
  // ==========================================

  function bloqueadoPorClase(
    numero,
    tramo = tramoActual
  ) {

    return (
      CLASE === 'ECONOMICA' &&
      esPremium(numero, tramo)
    );
  }

  // ==========================================
  // CREAR BOTONES DE ASIENTOS
  // ==========================================

  function crearBoton(numero) {

    const asiento = mapas[tramoActual].get(numero);

    if (!asiento) {
      return null;
    }

    const boton = document.createElement('button');

    boton.type = 'button';
    boton.className = 'asiento-bus';
    boton.dataset.numero = numero;
    boton.textContent = numero;

    boton.addEventListener('click', function () {
      seleccionarAsiento(numero);
    });

    return boton;
  }

  // ==========================================
  // GENERAR MAPA DEL BUS
  // ==========================================

  function generarMapa() {

    const contenedor = $('filasAsientos');
    const trasero = $('filaTrasera');

    contenedor.innerHTML = '';
    trasero.innerHTML = '';

    const mapa = mapas[tramoActual];

    const filas = new Set();

    for (const numero of mapa.keys()) {

      const coincidencia = numero.match(
        /^(\d+)[ABCD]$/
      );

      if (coincidencia) {
        filas.add(Number(coincidencia[1]));
      }

    }

    const filasOrdenadas = [...filas].sort(
      (a, b) => a - b
    );

    filasOrdenadas.forEach(fila => {

      const div = document.createElement('div');

      div.className = 'fila-bus';

      const etiqueta = document.createElement('span');

      etiqueta.className = 'num-fila';
      etiqueta.textContent = fila;

      div.appendChild(etiqueta);

      ['A', 'B', '', 'C', 'D'].forEach(columna => {

        if (!columna) {

          const pasillo = document.createElement('span');

          pasillo.className = 'pasillo-bus';

          div.appendChild(pasillo);

          return;
        }

        const numero = `${fila}${columna}`;

        const boton = crearBoton(numero);

        if (boton) {

          div.appendChild(boton);

        } else {

          const espacio = document.createElement('span');

          espacio.style.width = '38px';
          espacio.style.height = '38px';
          espacio.style.flexShrink = '0';

          div.appendChild(espacio);
        }

      });

      contenedor.appendChild(div);

    });

    // ASIENTOS ADICIONALES DE LA PARTE TRASERA

    const adicionales = [...mapa.keys()]
      .filter(numero => /^\d+$/.test(numero))
      .sort((a, b) => Number(a) - Number(b));

    adicionales.forEach(numero => {

      const boton = crearBoton(numero);

      if (boton) {
        trasero.appendChild(boton);
      }

    });

    trasero.style.display =
      adicionales.length ? 'flex' : 'none';
  }

  // ==========================================
  // PINTAR ASIENTOS
  // ==========================================

  function pintarAsientos() {

    document.querySelectorAll(
      '.asiento-bus[data-numero]'
    ).forEach(boton => {

      const numero = boton.dataset.numero;

      const ocupado = estaOcupado(numero);

      const premium = esPremium(numero);

      const seleccionado =
        seleccionados[tramoActual].includes(numero);

      const bloqueado =
        bloqueadoPorClase(numero);

      boton.classList.remove(
        'asiento-libre',
        'asiento-ocupado',
        'asiento-premium',
        'asiento-seleccionado',
        'asiento-bloqueado'
      );

      // PRIORIDAD 1: OCUPADO
      // SI ESTÁ RESERVADO, SIEMPRE ROJO.

      if (ocupado) {

        boton.classList.add(
          'asiento-ocupado'
        );

      // PRIORIDAD 2: SELECCIONADO

      } else if (seleccionado) {

        boton.classList.add(
          'asiento-seleccionado'
        );

      // PRIORIDAD 3: PREMIUM
      // INCLUYE 2B.

      } else if (premium) {

        boton.classList.add(
          'asiento-premium'
        );

      // PRIORIDAD 4: DISPONIBLE

      } else {

        boton.classList.add(
          'asiento-libre'
        );
      }

      if (bloqueado && !ocupado) {

        boton.classList.add(
          'asiento-bloqueado'
        );
      }

      boton.disabled =
        ocupado || bloqueado;

      boton.title = ocupado
        ? 'Asiento ocupado'
        : bloqueado
          ? 'Solo para tarifa Premium'
          : premium
            ? 'Asiento Premium disponible'
            : 'Asiento estándar disponible';

      boton.setAttribute(
        'aria-label',
        `Asiento ${numero}, ${
          premium ? 'Premium' : 'Estándar'
        }, ${
          ocupado ? 'ocupado' : 'disponible'
        }`
      );

    });
  }

  // ==========================================
  // SELECCIONAR ASIENTO
  // ==========================================

  function seleccionarAsiento(numero) {

    if (!cargado) {
      return;
    }

    if (estaOcupado(numero)) {

      avisar(
        'El asiento ' + numero + ' está ocupado.',
        'warning'
      );

      return;
    }

    if (bloqueadoPorClase(numero)) {

      avisar(
        'El asiento ' + numero +
        ' es Premium. Debes elegir tarifa Premium.',
        'warning'
      );

      return;
    }

    const lista = seleccionados[tramoActual];

    if (lista.includes(numero)) {

      seleccionados[tramoActual] =
        lista.filter(a => a !== numero);

    } else {

      if (lista.length >= NUM_PASAJEROS) {

        avisar(
          'Solo puedes seleccionar ' +
          NUM_PASAJEROS + ' asiento(s).',
          'warning'
        );

        return;
      }

      lista.push(numero);
    }

    pintarAsientos();
    actualizarResumen();

    if (completo(tramoActual)) {

      const otro = tramos.find(
        t => t !== tramoActual && !completo(t)
      );

      if (otro) {

        avisar(
          'Ahora selecciona los asientos de la vuelta.',
          'info'
        );

        setTimeout(
          () => cambiarTramo(otro),
          500
        );
      }
    }
  }

  // ==========================================
  // INFORMACIÓN DEL VIAJE
  // ==========================================

  function actualizarInfo() {

    const viaje = VIAJE[tramoActual];

    $('selRuta').textContent = nombreRuta(viaje);

    let fecha = '';

    if (viaje.ida) {

      const d = new Date(
        viaje.ida + 'T00:00:00'
      );

      fecha = d.toLocaleDateString(
        'es-CO',
        {
          weekday: 'short',
          day: 'numeric',
          month: 'short'
        }
      ) + ' · ';
    }

    $('selSalida').textContent =
      fecha + (viaje.salida || '—');

    let ayuda =
      'Selecciona ' + NUM_PASAJEROS +
      ' asiento(s) para continuar.';

    if (CLASE === 'ECONOMICA') {

      ayuda +=
        ' Los asientos Premium ⭐ son solo para tarifa Premium.';
    }

    $('textoAyuda').textContent = ayuda;
  }

  // ==========================================
  // PESTAÑAS IDA Y VUELTA
  // ==========================================

  function dibujarTabs() {

    if (tramos.length < 2) {
      return;
    }

    $('tabsTramo').classList.remove('d-none');

    $('listaTabsTramo').innerHTML =
      tramos.map(tramo => `

        <li class="nav-item">

          <button
            type="button"
            class="nav-link ${
              tramo === tramoActual ? 'active' : ''
            }"
            data-tramo="${tramo}">

            ${etiquetaTramo(tramo)}

            ${completo(tramo) ? '✓' : ''}

          </button>

        </li>

      `).join('');
  }

  function cambiarTramo(tramo) {

    if (!mapas[tramo]?.size) {
      return;
    }

    tramoActual = tramo;

    generarMapa();
    pintarAsientos();
    actualizarInfo();
    actualizarResumen();
  }

  $('listaTabsTramo').addEventListener(
    'click',
    evento => {

      const boton = evento.target.closest(
        '[data-tramo]'
      );

      if (boton) {
        cambiarTramo(boton.dataset.tramo);
      }

    }
  );

  // ==========================================
  // RESUMEN DE ASIENTOS
  // ==========================================

  function actualizarResumen() {

    const bloques = tramos.map(tramo => {

      const titulo = tramos.length > 1
        ? `<strong>${etiquetaTramo(tramo)}</strong><br>`
        : '';

      const lista = seleccionados[tramo];

      if (!lista.length) {

        return titulo +
          'Ningún asiento seleccionado';
      }

      const lineas = lista.map(
        (numero, indice) => {

          const pasajero =
            pasajerosGuardados[indice];

          const nombre = pasajero?.nombre
            ? ' (' + esc(pasajero.nombre) + ')'
            : '';

          return (
            'Pasajero ' +
            (indice + 1) +
            nombre +
            ': <strong>' +
            esc(numero) +
            '</strong>'
          );
        }
      );

      return titulo + lineas.join('<br>');
    });

    $('resumenAsientos').innerHTML =
      bloques.join('<hr class="my-2">');

    // GUARDAR ASIENTOS PARA EL PAGO

    tramos.forEach(tramo => {

      if (completo(tramo)) {

        sessionStorage.setItem(
          CLAVES[tramo],
          JSON.stringify(
            seleccionados[tramo]
          )
        );

      } else {

        sessionStorage.removeItem(
          CLAVES[tramo]
        );
      }

    });

    if (completo('ida')) {

      sessionStorage.setItem(
        'concorde_asiento',
        seleccionados.ida.join(', ')
      );

    } else {

      sessionStorage.removeItem(
        'concorde_asiento'
      );
    }

    const todoCompleto =
      cargado && tramos.every(completo);

    const boton = $('btnContinuarAsientos');

    boton.style.pointerEvents =
      todoCompleto ? '' : 'none';

    boton.style.opacity =
      todoCompleto ? '' : '.6';

    if (todoCompleto) {

      boton.removeAttribute(
        'aria-disabled'
      );

    } else {

      boton.setAttribute(
        'aria-disabled',
        'true'
      );
    }

    dibujarTabs();
  }

  // ==========================================
  // RESTAURAR SELECCIÓN ANTERIOR
  // ==========================================

  function restaurarSeleccion() {

    tramos.forEach(tramo => {

      const guardados = leer(
        CLAVES[tramo]
      );

      if (!Array.isArray(guardados)) {
        return;
      }

      seleccionados[tramo] = guardados
        .map(normalizar)
        .filter(numero => {

          const asiento =
            mapas[tramo].get(numero);

          if (!asiento) {
            return false;
          }

          if (estaOcupado(numero, tramo)) {
            return false;
          }

          if (bloqueadoPorClase(numero, tramo)) {
            return false;
          }

          return true;
        })
        .slice(0, NUM_PASAJEROS);
    });
  }

  // ==========================================
  // INICIALIZACIÓN
  // ==========================================

  async function iniciar() {

    $('filasAsientos').innerHTML = `
      <div class="text-center py-4">

        <div
          class="spinner-border text-primary mb-2"
          role="status">
        </div>

        <p class="small mb-0">
          Consultando disponibilidad real...
        </p>

      </div>
    `;

    $('filaTrasera').style.display = 'none';

    try {

      // CONSULTAR CADA VIAJE POR SEPARADO

      await Promise.all(
        tramos.map(
          tramo => cargarAsientos(tramo)
        )
      );

      restaurarSeleccion();

      cargado = true;

      generarMapa();
      pintarAsientos();
      actualizarInfo();
      actualizarResumen();

      console.log(
        'CONCORDE: mapa de asientos actualizado',
        {
          viajeIda: obtenerIdViaje(viajeIda),

          viajeVuelta: viajeVuelta
            ? obtenerIdViaje(viajeVuelta)
            : null,

          asientosIda: mapas.ida.size,

          asientosVuelta: mapas.vuelta.size,

          premiumPrimerasDosFilas: [
            '1A',
            '1B',
            '1C',
            '1D',
            '2A',
            '2B',
            '2C',
            '2D'
          ]
        }
      );

    } catch (error) {

      console.error(
        'Error al cargar asientos:',
        error
      );

      cargado = false;

      $('filasAsientos').innerHTML = `
        <div class="alert alert-danger text-center">

          <strong>
            No se pudieron cargar los asientos.
          </strong>

          <p class="small mt-2">
            ${esc(error.message)}
          </p>

          <button
            type="button"
            class="btn btn-outline-danger btn-sm"
            onclick="location.reload()">

            Reintentar

          </button>

        </div>
      `;

      $('filaTrasera').style.display = 'none';

      avisar(
        'No se pudo verificar la disponibilidad.',
        'danger'
      );

      actualizarResumen();
    }
  }

  iniciar();

})();
</script>

</body>
</html>
