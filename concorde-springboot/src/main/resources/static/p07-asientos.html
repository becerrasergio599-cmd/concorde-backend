<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selección de asientos del bus - Concorde Transporte Terrestre">
  <title>Concorde Transporte Terrestre | Selección de Asientos</title>
  <link rel="icon" type="image/png" href="img/LogoConcorde.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Mapa de asientos estilo bus */
    .bus-body {
      background: var(--gris-claro);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 340px;
      margin: 0 auto;
      border: 2px solid var(--gris-medio);
    }
    .bus-frente {
      background: linear-gradient(135deg, var(--azul-principal), var(--azul-claro));
      border-radius: 12px 12px 4px 4px;
      padding: 0.6rem;
      text-align: center;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }
    .fila-bus {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 5px;
      justify-content: center;
    }
    .num-fila {
      width: 22px;
      font-size: 0.6rem;
      color: var(--gris-texto);
      text-align: center;
      flex-shrink: 0;
    }
    .pasillo-bus { width: 18px; flex-shrink: 0; }
    .asiento-bus {
      width: 38px;
      height: 38px;
      border-radius: 6px 6px 4px 4px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.25s;
      font-size: 0.62rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* Respaldo del asiento */
    .asiento-bus::before {
      content: '';
      position: absolute;
      top: 0; left: 2px; right: 2px;
      height: 6px;
      background: rgba(0,0,0,0.1);
      border-radius: 3px 3px 0 0;
    }
    .asiento-libre  { background: #e8f4ea; border-color: #28a745; color: #155724; }
    .asiento-libre:hover  { background: #28a745; color: white; transform: scale(1.08); }
    .asiento-ocupado { background: #f8d7da; border-color: #dc3545; color: #721c24; cursor: not-allowed; }
    .asiento-seleccionado { background: var(--dorado); border-color: var(--dorado-oscuro); color: var(--azul-oscuro); transform: scale(1.08); box-shadow: 0 3px 10px rgba(245,166,35,0.4); }
    .asiento-premium { background: rgba(245,166,35,0.15); border-color: var(--dorado); color: var(--dorado-oscuro); }
    .asiento-premium:hover { background: var(--dorado); color: white; transform: scale(1.08); }
    .bus-trasero {
      background: var(--gris-medio);
      border-radius: 4px 4px 12px 12px;
      padding: 5px;
      text-align: center;
      margin-top: 0.8rem;
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    /* Pestañas Ida / Vuelta */
    #listaTabsTramo .nav-link { color: var(--azul-principal); font-weight: 600; font-size: .85rem; }
    #listaTabsTramo .nav-link.active { background: var(--azul-principal); color: #fff; }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main id="contenido-principal" class="py-4">
    <div class="container">
      <nav class="stepper" aria-label="Pasos del proceso de compra">
        <div class="step completado"><div class="step-numero">✓</div><span class="step-label">Buscar</span></div>
        <div class="step-linea completado"></div>
        <div class="step completado"><div class="step-numero">✓</div><span class="step-label">Detalle</span></div>
        <div class="step-linea completado"></div>
        <div class="step completado"><div class="step-numero">✓</div><span class="step-label">Pasajero</span></div>
        <div class="step-linea completado"></div>
        <div class="step activo" aria-current="step"><div class="step-numero">4</div><span class="step-label">Asientos</span></div>
        <div class="step-linea"></div>
        <div class="step"><div class="step-numero">5</div><span class="step-label">Pago</span></div>
      </nav>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card-concorde">
            <div class="card-header-concorde">
              <i class="bi bi-grid-3x3-gap me-2" aria-hidden="true"></i>Mapa de asientos del bus
            </div>
            <div class="card-body">

              <!-- Pestañas Ida / Vuelta (solo si la compra es de ida y vuelta) -->
              <div id="tabsTramo" class="d-none mb-3">
                <ul class="nav nav-pills nav-fill gap-2" id="listaTabsTramo" aria-label="Elegir tramo"></ul>
              </div>

              <!-- Leyenda -->
              <div class="d-flex flex-wrap gap-3 mb-4 justify-content-center" role="legend" aria-label="Leyenda de asientos">
                <span class="d-flex align-items-center gap-1">
                  <span class="asiento-bus asiento-libre" style="width:22px;height:22px;display:inline-block;font-size:0" aria-hidden="true"></span>
                  <small>Disponible</small>
                </span>
                <span class="d-flex align-items-center gap-1">
                  <span class="asiento-bus asiento-ocupado" style="width:22px;height:22px;display:inline-block;font-size:0" aria-hidden="true"></span>
                  <small>Ocupado</small>
                </span>
                <span class="d-flex align-items-center gap-1">
                  <span class="asiento-bus asiento-seleccionado" style="width:22px;height:22px;display:inline-block;font-size:0" aria-hidden="true"></span>
                  <small>Seleccionado</small>
                </span>
                <span class="d-flex align-items-center gap-1">
                  <span class="asiento-bus asiento-premium" style="width:22px;height:22px;display:inline-block;font-size:0" aria-hidden="true"></span>
                  <small>Premium ⭐</small>
                </span>
              </div>

              <!-- Bus layout -->
              <div class="bus-body" aria-label="Mapa interactivo de asientos del bus" id="busBody" data-pasajeros="1">
                <div class="bus-frente">🚌 FRENTE · CONDUCTOR</div>

                <!-- Referencia de columnas -->
                <div class="fila-bus mb-1">
                  <span class="num-fila"></span>
                  <span style="width:38px;text-align:center;font-size:.6rem;color:var(--gris-texto)">A</span>
                  <span style="width:38px;text-align:center;font-size:.6rem;color:var(--gris-texto)">B</span>
                  <span class="pasillo-bus"></span>
                  <span style="width:38px;text-align:center;font-size:.6rem;color:var(--gris-texto)">C</span>
                  <span style="width:38px;text-align:center;font-size:.6rem;color:var(--gris-texto)">D</span>
                </div>

                <!-- Filas se generan con JS -->
                <div id="filasAsientos"></div>

                <!-- Fila trasera (5 asientos) -->
                <div class="bus-trasero" id="filaTrasera"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card-concorde" style="position:sticky;top:80px">
            <div class="card-header-concorde"><i class="bi bi-info-circle me-2" aria-hidden="true"></i>Tu selección</div>
            <div class="card-body">
              <p class="mb-1 small"><strong>Trayecto:</strong> <span id="selRuta">—</span></p>
              <p class="mb-2 small"><strong>Salida:</strong> <span id="selSalida">—</span></p>
              <div id="resumenAsientos" class="alerta-advertencia alerta-concorde mb-3 small"
                role="status" aria-live="polite">
                Ningún asiento seleccionado
              </div>
              <a href="p08-resumen-compra.html" id="btnContinuarAsientos"
                class="btn btn-concorde-dorado w-100 py-2"
                style="pointer-events:none;opacity:0.6" aria-disabled="true">
                Continuar al resumen
                <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
              </a>
              <p class="small text-muted mt-2 text-center" id="textoAyuda"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function(){ var u=Auth.getUsuario(); if(!u) window.location.href='p03-login.html'; else if(u.rol==='administrador') window.location.href='admin-panel.html'; })();
  </script>
  <script src="js/componentes.js"></script>
  <script src="js/main.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    function leer(k) { try { return JSON.parse(sessionStorage.getItem(k) || 'null'); } catch (e) { return null; } }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ── Tramos: la ida siempre; la vuelta solo si la compra es de ida y vuelta ──
    const viajeIda = leer('concorde_viaje') || {};
    const viajeVuelta = leer('concorde_viaje_vuelta');
    const tramos = viajeVuelta ? ['ida', 'vuelta'] : ['ida'];
    const VIAJE = { ida: viajeIda, vuelta: viajeVuelta || {} };
    const CLAVES = { ida: 'concorde_asientos', vuelta: 'concorde_asientos_vuelta' };
    const sel = { ida: [], vuelta: [] };   // asientos elegidos por tramo
    let tramoActual = 'ida';

    // Asientos ocupados (fila+columna)
    const ocupados = ['1A','1C','2B','3D','4A','4B','5C','6D','7A','8B','9C','10D','11A'];
    const premium  = ['1A','1B','1C','1D','2A','2B','2C','2D']; // primeras 2 filas

    // ── Cantidad de pasajeros ──────────────────────────────────────────
    // Busca el número en el viaje guardado, en la URL o en sessionStorage.
    // Si no lo encuentra, usa 1.
    function getNumPasajeros() {
      const params = new URLSearchParams(location.search);
      const candidatos = [
        viajeIda.pasajeros, viajeIda.numPasajeros, viajeIda.numeroPasajeros, viajeIda.cantidad, viajeIda.cantidadPasajeros,
        params.get('pasajeros'), params.get('numPasajeros'),
        sessionStorage.getItem('concorde_num_pasajeros')
      ];
      for (const c of candidatos) {
        const n = parseInt(c, 10);
        if (n > 0) return n;
      }
      const lista = leer('concorde_pasajeros');
      if (Array.isArray(lista) && lista.length > 0) return lista.length;
      return 1;
    }

    const NUM_PASAJEROS = getNumPasajeros();
    $('busBody').dataset.pasajeros = NUM_PASAJEROS;

    // Pasajeros guardados en p06 (para mostrar a quién corresponde cada asiento)
    const pasajerosGuardados = (function () {
      const a = leer('concorde_pasajeros');
      return Array.isArray(a) ? a : [];
    })();

    function etiquetaTramo(t) { return t === 'ida' ? 'Ida' : 'Vuelta'; }
    function nombreRuta(v) {
      return (v.terminalOrigen || v.origen || '—') + ' → ' + (v.terminalDestino || v.destino || '—');
    }
    function completo(t) { return sel[t].length === NUM_PASAJEROS; }

    // Datos del tramo que se está eligiendo (ruta, salida y texto de ayuda)
    function infoTramo() {
      const v = VIAJE[tramoActual];
      let f = '';
      if (v.ida) {
        f = new Date(v.ida + 'T00:00:00').toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ';
      }
      $('selRuta').textContent = nombreRuta(v);
      $('selSalida').textContent = f + (v.salida || '—');
      const pl = NUM_PASAJEROS > 1 ? 's' : '';
      $('textoAyuda').textContent = tramos.length > 1
        ? 'Selecciona ' + NUM_PASAJEROS + ' asiento' + pl + ' para la ' + etiquetaTramo(tramoActual).toLowerCase() +
          ' (y para el otro tramo) para continuar'
        : 'Selecciona ' + NUM_PASAJEROS + ' asiento' + pl + ' para continuar';
    }

    function dibujarTabs() {
      if (tramos.length < 2) return;
      $('tabsTramo').classList.remove('d-none');
      $('listaTabsTramo').innerHTML = tramos.map(t => `
        <li class="nav-item" role="presentation">
          <button type="button" class="nav-link ${t === tramoActual ? 'active' : ''}" data-tramo="${t}">
            ${etiquetaTramo(t)} · ${esc(nombreRuta(VIAJE[t]))} ${completo(t) ? '✓' : ''}
          </button>
        </li>`).join('');
    }

    function cambiarTramo(t) {
      tramoActual = t;
      pintarSeleccion();
      infoTramo();
      dibujarTabs();
    }

    $('listaTabsTramo').addEventListener('click', function (e) {
      const b = e.target.closest('[data-tramo]');
      if (b) cambiarTramo(b.dataset.tramo);
    });

    function generarFilas() {
      const contenedor = $('filasAsientos');
      for (let fila = 1; fila <= 12; fila++) {
        const div = document.createElement('div');
        div.className = 'fila-bus';
        div.innerHTML = `<span class="num-fila">${fila}</span>`;

        ['A','B','','C','D'].forEach(col => {
          if (col === '') {
            // appendChild (no innerHTML +=) para no borrar los clics de los asientos A y B
            const pasillo = document.createElement('span');
            pasillo.className = 'pasillo-bus';
            div.appendChild(pasillo);
            return;
          }
          const id = `${fila}${col}`;
          const esOcupado  = ocupados.includes(id);
          const esPremium  = premium.includes(id) && !esOcupado;
          let clase = esOcupado ? 'asiento-ocupado' : (esPremium ? 'asiento-premium' : 'asiento-libre');
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `asiento-bus ${clase}`;
          btn.dataset.numero = id;
          btn.textContent = id;
          btn.setAttribute('aria-label', `Asiento ${id}${esPremium?' Premium':''}, ${esOcupado?'ocupado':'disponible'}`);
          if (!esOcupado) btn.addEventListener('click', () => toggleAsiento(btn));
          div.appendChild(btn);
        });
        contenedor.appendChild(div);
      }

      // Fila trasera: 41–45
      const trasero = $('filaTrasera');
      ['41','42','43','44','45'].forEach(n => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'asiento-bus asiento-libre';
        btn.dataset.numero = n;
        btn.textContent = n;
        btn.setAttribute('aria-label', `Asiento ${n}, disponible`);
        btn.addEventListener('click', () => toggleAsiento(btn));
        trasero.appendChild(btn);
      });
    }

    // Repinta el mapa con los asientos del tramo actual
    function pintarSeleccion() {
      document.querySelectorAll('.asiento-bus[data-numero]').forEach(b => {
        if (b.classList.contains('asiento-ocupado')) return;
        const id = b.dataset.numero;
        b.classList.remove('asiento-libre', 'asiento-premium', 'asiento-seleccionado');
        b.classList.add(sel[tramoActual].includes(id)
          ? 'asiento-seleccionado'
          : (premium.includes(id) ? 'asiento-premium' : 'asiento-libre'));
      });
    }

    function toggleAsiento(btn) {
      const id = btn.dataset.numero;
      const lista = sel[tramoActual];

      if (lista.includes(id)) {
        // Quitar selección
        sel[tramoActual] = lista.filter(s => s !== id);
      } else {
        // Agregar selección (hasta el número de pasajeros)
        if (lista.length >= NUM_PASAJEROS) {
          UI.mostrarToast(
            'Solo puedes seleccionar ' + NUM_PASAJEROS + ' asiento' + (NUM_PASAJEROS > 1 ? 's' : ''),
            'warning'
          );
          return;
        }
        lista.push(id);
      }
      pintarSeleccion();
      actualizarResumen();

      // Al completar un tramo, pasa al otro si aún le faltan asientos
      if (completo(tramoActual)) {
        const otro = tramos.find(t => t !== tramoActual && !completo(t));
        if (otro) {
          UI.mostrarToast('Ahora elige los asientos de la ' + etiquetaTramo(otro).toLowerCase(), 'info');
          setTimeout(() => cambiarTramo(otro), 500);
        }
      }
    }

    function actualizarResumen() {
      const el  = $('resumenAsientos');
      const btn = $('btnContinuarAsientos');

      const bloques = tramos.map(t => {
        const titulo = tramos.length > 1 ? '<strong>' + etiquetaTramo(t) + '</strong><br>' : '';
        const lista = sel[t];
        if (!lista.length) return titulo + 'Ningún asiento seleccionado';
        const lineas = lista.map((s, i) => {
          const p = pasajerosGuardados[i];
          const quien = p && p.nombre ? ' (' + esc(p.nombre) + ')' : '';
          return 'Pasajero ' + (i + 1) + quien + ': <strong>' + esc(s) + '</strong>';
        });
        return titulo + lineas.join('<br>') +
          (completo(t) ? '' : '<br><span class="text-muted">Faltan ' + (NUM_PASAJEROS - lista.length) + '</span>');
      });
      el.innerHTML = bloques.join('<hr class="my-2">');

      // Se guarda cada tramo solo cuando está completo
      tramos.forEach(t => {
        if (completo(t)) sessionStorage.setItem(CLAVES[t], JSON.stringify(sel[t]));
        else sessionStorage.removeItem(CLAVES[t]);
      });
      // Compatibilidad: texto con los asientos de la ida separados por coma
      if (completo('ida')) sessionStorage.setItem('concorde_asiento', sel.ida.join(', '));
      else sessionStorage.removeItem('concorde_asiento');

      const todo = tramos.every(completo);
      btn.style.pointerEvents = todo ? '' : 'none';
      btn.style.opacity = todo ? '' : '0.6';
      if (todo) btn.removeAttribute('aria-disabled');
      else btn.setAttribute('aria-disabled', 'true');

      dibujarTabs();
    }

    // Si el usuario vuelve desde el resumen, se restauran sus asientos
    function restaurarAsientos() {
      tramos.forEach(t => {
        const g = leer(CLAVES[t]);
        if (!Array.isArray(g)) return;
        sel[t] = g.slice(0, NUM_PASAJEROS).filter(id => {
          const b = document.querySelector('.asiento-bus[data-numero="' + id + '"]');
          return b && !b.classList.contains('asiento-ocupado');
        });
      });
    }

    generarFilas();
    restaurarAsientos();
    pintarSeleccion();
    infoTramo();
    actualizarResumen();
  </script>
</body>
</html>
