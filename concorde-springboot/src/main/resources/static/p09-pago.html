
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pago - Concorde Transporte Terrestre">

  <title>Concorde Transporte Terrestre | Pago</title>

  <link rel="icon" type="image/png" href="img/LogoConcorde.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    .metodo-pago {
      border: 2px solid #e1e5eb;
      border-radius: 7px;
      cursor: pointer;
      transition: 0.2s;
      height: 100%;
      padding: 15px;
      background: white;
    }

    .metodo-pago:hover {
      border-color: #0055aa;
      background: #f8fbff;
    }

    .metodo-pago.activo {
      border-color: #0d6efd;
      background: #f4f8ff;
    }

    .metodo-pago label {
      cursor: pointer;
      display: block;
      width: 100%;
      margin-top: 7px;
    }

    .seccion-pago {
      animation: aparecerPago 0.2s ease;
    }

    @keyframes aparecerPago {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .campo-error {
      border-color: #dc3545 !important;
    }

    .mensaje-pago {
      border-radius: 7px;
      padding: 12px 15px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .mensaje-pago.error {
      background: #fff0f0;
      border: 1px solid #dc3545;
      color: #a51e2c;
    }

    .mensaje-pago.info {
      background: #eef6ff;
      border: 1px solid #b5d5ff;
      color: #174c85;
    }

    .btn-pagar {
      background: #eea11b;
      color: #071c3b;
      border: none;
      font-weight: 700;
      padding: 12px;
      border-radius: 5px;
    }

    .btn-pagar:hover {
      background: #d98e0c;
      color: #071c3b;
    }

    .btn-pagar:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Ajuste exclusivo para celulares: métodos de pago en 3 columnas */
    @media (max-width: 767.98px) {
      .metodo-pago {
        padding: 9px 7px;
        min-width: 0;
        overflow: hidden;
      }
      .metodo-pago label {
        font-size: 11px;
        line-height: 1.3;
        overflow-wrap: anywhere;
        word-break: normal;
        hyphens: auto;
      }
      .metodo-pago label i {
        font-size: 19px !important;
      }
      .metodo-pago input[type="radio"] {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="navbar-placeholder"></div>

  <main id="contenido-principal" class="py-4">
    <div class="container">

      <h1 class="h4 fw-bold texto-azul mb-4">
        <i class="bi bi-lock-fill me-2"></i>
        Pago Seguro
      </h1>

      <div class="alert alert-success mb-4">
        <i class="bi bi-shield-check me-2"></i>
        Simulación de pago de Concorde.
        No ingreses datos bancarios reales.
      </div>

      <div class="row g-4">

        <!-- FORMULARIO DE PAGO -->
        <div class="col-lg-8">

          <div class="card-concorde">

            <div class="card-header-concorde">
              <i class="bi bi-credit-card me-2"></i>
              Método de pago
            </div>

            <div class="card-body">

              <h5 class="fw-bold mb-3">
                Selecciona cómo pagar:
              </h5>

              <!-- MÉTODOS -->
              <div class="row g-2 mb-4">

                <div class="col-4">
                  <div class="metodo-pago activo" id="cardTarjeta">

                    <input
                      type="radio"
                      name="metodoPago"
                      id="metodoTarjeta"
                      value="tarjeta"
                      checked
                    >

                    <label for="metodoTarjeta">
                      <i class="bi bi-credit-card-2-front-fill text-primary fs-4 d-block mb-1"></i>
                      Tarjeta de crédito/débito
                    </label>

                  </div>
                </div>

                <div class="col-4">
                  <div class="metodo-pago" id="cardNequi">

                    <input
                      type="radio"
                      name="metodoPago"
                      id="metodoNequi"
                      value="nequi"
                    >

                    <label for="metodoNequi">
                      <i class="bi bi-phone-fill text-success fs-4 d-block mb-1"></i>
                      Nequi / Daviplata
                    </label>

                  </div>
                </div>

                <div class="col-4">
                  <div class="metodo-pago" id="cardPSE">

                    <input
                      type="radio"
                      name="metodoPago"
                      id="metodoPSE"
                      value="pse"
                    >

                    <label for="metodoPSE">
                      <i class="bi bi-bank2 text-warning fs-4 d-block mb-1"></i>
                      PSE / Transferencia
                    </label>

                  </div>
                </div>

              </div>

              <div
                id="mensajePago"
                class="mensaje-pago error d-none"
                role="alert"
              ></div>

              <!-- ========================= -->
              <!-- PAGO CON TARJETA -->
              <!-- ========================= -->

              <div id="pago-tarjeta" class="seccion-pago">

                <form
                  id="formPago"
                  class="form-concorde"
                  novalidate
                  autocomplete="off"
                >

                  <div class="row g-3">

                    <div class="col-12">
                      <label for="nombreTarjeta" class="form-label">
                        Nombre en la tarjeta
                        <span class="text-danger">*</span>
                      </label>

                      <input
                        type="text"
                        id="nombreTarjeta"
                        class="form-control"
                        placeholder="Ej. Juan Carlos García"
                        maxlength="100"
                        required
                      >
                    </div>

                    <div class="col-12">

                      <label for="numeroTarjeta" class="form-label">
                        Número de tarjeta
                        <span class="text-danger">*</span>
                      </label>

                      <div class="input-group">

                        <input
                          type="text"
                          id="numeroTarjeta"
                          class="form-control"
                          placeholder="0000 0000 0000 0000"
                          maxlength="19"
                          inputmode="numeric"
                          required
                        >

                        <span class="input-group-text">
                          <i class="bi bi-credit-card"></i>
                        </span>

                      </div>

                    </div>

                    <div class="col-md-6">

                      <label for="expiracion" class="form-label">
                        Vencimiento
                        <span class="text-danger">*</span>
                      </label>

                      <input
                        type="text"
                        id="expiracion"
                        class="form-control"
                        placeholder="MM/AA"
                        maxlength="5"
                        inputmode="numeric"
                        required
                      >

                    </div>

                    <div class="col-md-6">

                      <label for="cvv" class="form-label">
                        CVV
                        <span class="text-danger">*</span>
                      </label>

                      <input
                        type="text"
                        id="cvv"
                        class="form-control"
                        placeholder="123"
                        maxlength="4"
                        inputmode="numeric"
                        required
                      >

                    </div>

                    <div class="col-12">

                      <button
                        type="submit"
                        id="btnPagarTarjeta"
                        class="btn btn-pagar w-100"
                      >
                        <i class="bi bi-lock-fill me-2"></i>
                        Pagar <span id="btnTotal">$0</span> COP
                      </button>

                    </div>

                  </div>

                </form>

              </div>

              <!-- ========================= -->
              <!-- PAGO CON NEQUI -->
              <!-- ========================= -->

              <div id="pago-nequi" class="seccion-pago d-none">

                <div class="mensaje-pago info">
                  <i class="bi bi-phone me-2"></i>
                  Simulación de pago por Nequi o Daviplata.
                </div>

                <div class="mb-3">

                  <label for="billetera" class="form-label">
                    Selecciona tu billetera
                  </label>

                  <select id="billetera" class="form-select">
                    <option value="NEQUI">Nequi</option>
                    <option value="DAVIPLATA">Daviplata</option>
                  </select>

                </div>

                <div class="mb-3">

                  <label for="numNequi" class="form-label">
                    Número de celular
                    <span class="text-danger">*</span>
                  </label>

                  <input
                    type="tel"
                    id="numNequi"
                    class="form-control"
                    placeholder="Ingresa tu número de teléfono"
                    maxlength="10"
                    inputmode="numeric"
                  >

                </div>

                <button
                  type="button"
                  id="btnPagarNequi"
                  class="btn btn-pagar w-100"
                >
                  <i class="bi bi-phone me-2"></i>
                  Simular pago con Nequi / Daviplata
                </button>

              </div>

              <!-- ========================= -->
              <!-- PAGO CON PSE -->
              <!-- ========================= -->

              <div id="pago-pse" class="seccion-pago d-none">

                <div class="mensaje-pago info">
                  <i class="bi bi-bank2 me-2"></i>
                  Simulación de transferencia bancaria PSE.
                  No se abrirá un banco real.
                </div>

                <div class="mb-3">

                  <label for="bancoPSE" class="form-label">
                    Selecciona tu banco
                    <span class="text-danger">*</span>
                  </label>

                  <select id="bancoPSE" class="form-select">

                    <option value="">
                      Selecciona un banco
                    </option>

                    <option value="BANCOLOMBIA">
                      Bancolombia
                    </option>

                    <option value="DAVIVIENDA">
                      Davivienda
                    </option>

                    <option value="BANCO_BOGOTA">
                      Banco de Bogotá
                    </option>

                    <option value="BBVA">
                      BBVA
                    </option>

                    <option value="BANCO_POPULAR">
                      Banco Popular
                    </option>

                    <option value="BANCO_AGRARIO">
                      Banco Agrario
                    </option>

                    <option value="OTRO">
                      Otro banco
                    </option>

                  </select>

                </div>

                <div class="mb-3">

                  <label for="tipoPersonaPSE" class="form-label">
                    Tipo de persona
                  </label>

                  <select
                    id="tipoPersonaPSE"
                    class="form-select"
                  >
                    <option value="NATURAL">
                      Persona natural
                    </option>

                    <option value="JURIDICA">
                      Persona jurídica
                    </option>
                  </select>

                </div>

                <button
                  type="button"
                  id="btnPagarPSE"
                  class="btn btn-pagar w-100"
                >
                  <i class="bi bi-bank2 me-2"></i>
                  Simular pago con PSE
                </button>

              </div>

            </div>
          </div>
        </div>

        <!-- ========================= -->
        <!-- RESUMEN DE RESERVA -->
        <!-- ========================= -->

        <div class="col-lg-4">

          <div
            class="card-concorde"
            style="position:sticky;top:80px"
          >

            <div class="card-header-concorde">
              <i class="bi bi-receipt me-2"></i>
              Tu reserva
            </div>

            <div class="card-body small">

              <p
                class="mb-1 fw-bold"
                id="resRuta"
              >—</p>

              <p
                class="mb-1 text-muted"
                id="resFecha"
              >—</p>

              <p
                class="mb-1 text-muted"
                id="resClase"
              >—</p>

              <div id="resVuelta" class="d-none">

                <hr class="my-2">

                <p
                  class="mb-1 fw-bold"
                  id="resRutaV"
                >—</p>

                <p
                  class="mb-1 text-muted"
                  id="resFechaV"
                >—</p>

                <p
                  class="mb-1 text-muted"
                  id="resClaseV"
                >—</p>

              </div>

              <hr class="my-2">

              <div
                class="mb-1 text-muted"
                id="resPasajero"
              >—</div>

              <hr>

              <div class="d-flex justify-content-between fw-bold fs-5">

                <span>Total</span>

                <span
                  class="texto-azul"
                  id="resTotal"
                >$0</span>

              </div>

            </div>
          </div>

        </div>

      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <!-- LIBRERÍAS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/auth.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/main.js"></script>

  <script>
  (function () {
    'use strict';

    // =========================================
    // FUNCIONES AUXILIARES
    // =========================================

    function elemento(id) {
      return document.getElementById(id);
    }

    function leerJSON(clave) {
      try {
        return JSON.parse(
          sessionStorage.getItem(clave) || 'null'
        );
      } catch (error) {
        return null;
      }
    }

    function dinero(valor) {
      return '$' +
        Math.round(Number(valor) || 0)
          .toLocaleString('es-CO');
    }

    function escapar(texto) {
      return String(texto).replace(
        /[&<>"']/g,
        function (caracter) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
          }[caracter];
        }
      );
    }

    function mostrarError(mensaje) {
      var caja = elemento('mensajePago');

      caja.textContent = mensaje;
      caja.classList.remove('d-none');

      caja.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });

      console.warn('Concorde:', mensaje);
    }

    function limpiarError() {
      elemento('mensajePago').classList.add('d-none');

      document.querySelectorAll('.campo-error')
        .forEach(function (campo) {
          campo.classList.remove('campo-error');
        });
    }

    function errorCampo(id, mensaje) {
      var campo = elemento(id);

      if (campo) {
        campo.classList.add('campo-error');
        campo.focus();
      }

      mostrarError(mensaje);

      return false;
    }

    function claseDe(v) {
      var clase = String(v.clase || 'ECONOMICA')
        .trim()
        .toUpperCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');

      return clase === 'PREMIUM'
        ? 'PREMIUM'
        : 'ECONOMICA';
    }

    function fechaCorta(v) {
      if (!v || !v.ida) {
        return 'Fecha no disponible';
      }

      var fecha = new Date(v.ida + 'T00:00:00');

      if (isNaN(fecha.getTime())) {
        return v.ida;
      }

      return fecha.toLocaleDateString('es-CO', {
        weekday: 'short',
        day: 'numeric',
        month: 'short'
      });
    }

    function fechaConAnio(v) {
      if (!v || !v.ida) {
        return 'Fecha no disponible';
      }

      var fecha = new Date(v.ida + 'T00:00:00');

      if (isNaN(fecha.getTime())) {
        return v.ida;
      }

      return fecha.toLocaleDateString('es-CO', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
    }

    function normalizarAsientos(valor) {
      if (Array.isArray(valor)) {
        return valor.map(function (a) {
          return String(a).trim().toUpperCase();
        }).filter(Boolean);
      }

      if (valor) {
        return String(valor)
          .split(',')
          .map(function (a) {
            return a.trim().toUpperCase();
          })
          .filter(Boolean);
      }

      return [];
    }

    // =========================================
    // DATOS DE LA RESERVA
    // =========================================

    var viaje = leerJSON('concorde_viaje');

    var usuario = (
      typeof Auth !== 'undefined' &&
      typeof Auth.getUsuario === 'function'
    ) ? Auth.getUsuario() : null;

    if (!usuario) {
      window.location.replace('p03-login.html');
      return;
    }

    if (!viaje) {
      window.location.replace('index.html');
      return;
    }

    var viajeV = leerJSON('concorde_viaje_vuelta');

    var hayVuelta = !!viajeV;

    var numPax = Number(viaje.pasajeros || 1) || 1;

    var asRaw = leerJSON('concorde_asientos');

    if (!asRaw) {
      asRaw = sessionStorage.getItem('concorde_asiento');
    }

    var listaAsientos = normalizarAsientos(asRaw);

    var listaAsientosV = normalizarAsientos(
      leerJSON('concorde_asientos_vuelta')
    );

    var paxRaw = leerJSON('concorde_pasajeros');

    if (!paxRaw) {
      paxRaw = leerJSON('concorde_pasajero');
    }

    var listaPax = Array.isArray(paxRaw)
      ? paxRaw
      : (paxRaw ? [paxRaw] : []);

    var nombreRespaldo =
      usuario.nombreCompleto ||
      usuario.nombre ||
      'Pasajero';

    var nombres = [];

    for (var i = 0; i < numPax; i++) {
      var pasajero = listaPax[i];

      nombres.push(
        pasajero && pasajero.nombre
          ? pasajero.nombre
          : (
              i === 0
                ? nombreRespaldo
                : 'Pasajero ' + (i + 1)
            )
      );
    }

    var nombrePasajero = nombres.join(', ');

    var asiento = listaAsientos.join(', ');

    var asientoV = listaAsientosV.join(', ');

    var fecha = fechaCorta(viaje);

    var fechaV = hayVuelta
      ? fechaCorta(viajeV)
      : '';

    var claseBackend = claseDe(viaje);

    var claseNombre = claseBackend === 'PREMIUM'
      ? 'Premium'
      : 'Económico';

    var claseBackendV = hayVuelta
      ? claseDe(viajeV)
      : '';

    var claseNombreV = claseBackendV === 'PREMIUM'
      ? 'Premium'
      : 'Económico';

    var unit = Number(
      viaje.precioUnitario ||
      viaje.precio ||
      0
    );

    var unitV = hayVuelta
      ? Number(
          viajeV.precioUnitario ||
          viajeV.precio ||
          0
        )
      : 0;

    var subIda = unit * numPax;

    var subVuelta = unitV * numPax;

    var totalCalculado = hayVuelta
      ? subIda + subVuelta
      : (
          viaje.total
            ? Number(viaje.total)
            : subIda
        );

    var totalGuardado = Number(
      sessionStorage.getItem('concorde_total')
    );

    var totalNumero = totalGuardado > 0
      ? totalGuardado
      : totalCalculado;

    var total = dinero(totalNumero);

    var totalIda = totalNumero;

    var totalVuelta = 0;

    if (hayVuelta && (subIda + subVuelta) > 0) {
      totalIda = Math.round(
        totalNumero * subIda / (subIda + subVuelta)
      );

      totalVuelta = Math.round(totalNumero) - totalIda;
    }

    // =========================================
    // MOSTRAR RESUMEN
    // =========================================

    elemento('resRuta').textContent =
      (viaje.terminalOrigen || '') +
      ' → ' +
      (viaje.terminalDestino || '');

    elemento('resFecha').textContent =
      fecha + ' · ' + (viaje.salida || '');

    elemento('resClase').textContent =
      (hayVuelta ? 'Ida · ' : '') +
      'Directo · ' +
      claseNombre;

    if (hayVuelta) {
      elemento('resVuelta').classList.remove('d-none');

      elemento('resRutaV').textContent =
        (viajeV.terminalOrigen || '') +
        ' → ' +
        (viajeV.terminalDestino || '');

      elemento('resFechaV').textContent =
        fechaV + ' · ' + (viajeV.salida || '');

      elemento('resClaseV').textContent =
        'Vuelta · Directo · ' + claseNombreV;
    }

    elemento('resPasajero').innerHTML =
      nombres.map(function (nombre, indice) {

        var asientoIda = listaAsientos[indice] || '—';

        var textoAsiento = hayVuelta
          ? (
              'Ida ' +
              asientoIda +
              ' · Vuelta ' +
              (listaAsientosV[indice] || '—')
            )
          : 'Asiento ' + asientoIda;

        return escapar(nombre) +
          ' · ' +
          escapar(textoAsiento);

      }).join('<br>');

    elemento('resTotal').textContent = total;

    elemento('btnTotal').textContent = total;

    // =========================================
    // CAMBIAR MÉTODO DE PAGO
    // =========================================

    var metodoActual = 'tarjeta';

    function cambiarMetodo(metodo) {

      metodoActual = metodo;

      limpiarError();

      elemento('pago-tarjeta')
        .classList.toggle('d-none', metodo !== 'tarjeta');

      elemento('pago-nequi')
        .classList.toggle('d-none', metodo !== 'nequi');

      elemento('pago-pse')
        .classList.toggle('d-none', metodo !== 'pse');

      elemento('cardTarjeta')
        .classList.toggle('activo', metodo === 'tarjeta');

      elemento('cardNequi')
        .classList.toggle('activo', metodo === 'nequi');

      elemento('cardPSE')
        .classList.toggle('activo', metodo === 'pse');

      var radio = document.querySelector(
        'input[name="metodoPago"][value="' + metodo + '"]'
      );

      if (radio) {
        radio.checked = true;
      }
    }

    document.querySelectorAll(
      'input[name="metodoPago"]'
    ).forEach(function (radio) {

      radio.addEventListener('change', function () {
        cambiarMetodo(this.value);
      });

    });

    [
      ['cardTarjeta', 'tarjeta'],
      ['cardNequi', 'nequi'],
      ['cardPSE', 'pse']
    ].forEach(function (config) {

      elemento(config[0]).addEventListener(
        'click',
        function () {
          cambiarMetodo(config[1]);
        }
      );

    });

    cambiarMetodo('tarjeta');

    // =========================================
    // FORMATO AUTOMÁTICO TARJETA
    // =========================================

    var inputTarjeta = elemento('numeroTarjeta');

    inputTarjeta.addEventListener('input', function () {

      var numeros = this.value
        .replace(/\D/g, '')
        .slice(0, 16);

      this.value = numeros
        .replace(/(.{4})/g, '$1 ')
        .trim();

      this.classList.remove('campo-error');
    });

    // =========================================
    // VENCIMIENTO MM/AA
    // =========================================

    var inputExpiracion = elemento('expiracion');

    inputExpiracion.addEventListener('input', function () {

      var numeros = this.value
        .replace(/\D/g, '')
        .slice(0, 4);

      if (numeros.length >= 2) {
        this.value =
          numeros.slice(0, 2) +
          '/' +
          numeros.slice(2);
      } else {
        this.value = numeros;
      }

      this.classList.remove('campo-error');
    });

    // =========================================
    // CVV SOLO NÚMEROS
    // =========================================

    elemento('cvv').addEventListener('input', function () {

      this.value = this.value
        .replace(/\D/g, '')
        .slice(0, 4);

      this.classList.remove('campo-error');
    });

    // =========================================
    // CELULAR SOLO NÚMEROS
    // =========================================

    elemento('numNequi').addEventListener('input', function () {

      this.value = this.value
        .replace(/\D/g, '')
        .slice(0, 10);

      this.classList.remove('campo-error');
    });

    // =========================================
    // VALIDAR TARJETA
    // =========================================

    function validarTarjeta() {

      limpiarError();

      var nombre = elemento('nombreTarjeta')
        .value.trim();

      var numero = elemento('numeroTarjeta')
        .value.replace(/\D/g, '');

      var vencimiento = elemento('expiracion')
        .value.trim();

      var cvv = elemento('cvv')
        .value.replace(/\D/g, '');

      if (nombre.length < 3) {
        return errorCampo(
          'nombreTarjeta',
          'Ingresa el nombre de la tarjeta.'
        );
      }

      if (!/^\d{16}$/.test(numero)) {
        return errorCampo(
          'numeroTarjeta',
          'El número de tarjeta de prueba debe tener 16 dígitos.'
        );
      }

      if (!/^\d{2}\/\d{2}$/.test(vencimiento)) {
        return errorCampo(
          'expiracion',
          'Ingresa el vencimiento en formato MM/AA.'
        );
      }

      var partes = vencimiento.split('/');

      var mes = Number(partes[0]);

      var anio = 2000 + Number(partes[1]);

      var hoy = new Date();

      var anioActual = hoy.getFullYear();

      var mesActual = hoy.getMonth() + 1;

      if (mes < 1 || mes > 12) {
        return errorCampo(
          'expiracion',
          'El mes debe estar entre 01 y 12.'
        );
      }

      if (
        anio < anioActual ||
        (anio === anioActual && mes < mesActual)
      ) {
        return errorCampo(
          'expiracion',
          'La fecha de vencimiento ya pasó.'
        );
      }

      if (!/^\d{3,4}$/.test(cvv)) {
        return errorCampo(
          'cvv',
          'El CVV debe tener 3 o 4 números.'
        );
      }

      return true;
    }

    // =========================================
    // VALIDAR NEQUI
    // =========================================

    function validarNequi() {

      limpiarError();

      var celular = elemento('numNequi')
        .value.replace(/\D/g, '');

      if (!/^3\d{9}$/.test(celular)) {
        return errorCampo(
          'numNequi',
          'Ingresa un número de celular válido de 10 dígitos que empiece por 3.'
        );
      }

      return true;
    }

    // =========================================
    // VALIDAR PSE
    // =========================================

    function validarPSE() {

      limpiarError();

      if (!elemento('bancoPSE').value) {
        return errorCampo(
          'bancoPSE',
          'Selecciona el banco para continuar.'
        );
      }

      return true;
    }

    // =========================================
    // CREAR RESERVA EN SPRING BOOT
    // =========================================

    async function crearReserva(
      v,
      claseBack,
      totalN,
      asientosSeleccionados
    ) {

      var idUsuario =
        usuario.idUsuario ||
        usuario.id;

      var idViaje = Number(v.idViaje);

      if (!idUsuario || !idViaje) {
        throw new Error(
          'No se encontró el usuario o el viaje.'
        );
      }

      if (
        !Number.isFinite(totalN) ||
        totalN <= 0
      ) {
        throw new Error(
          'El valor de la reserva no es válido.'
        );
      }

      var numerosAsientos =
        asientosSeleccionados.map(function (numero) {
          return String(numero)
            .trim()
            .toUpperCase();
        });

      var respuesta = await fetch('/api/reservas', {

        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({

          usuario: {
            idUsuario: idUsuario
          },

          viaje: {
            idViaje: idViaje
          },

          estado: 'CONFIRMADA',

          clase: claseBack,

          total: Math.round(totalN),

          numerosAsientos: numerosAsientos

        })

      });

      if (!respuesta.ok) {

        var textoError = await respuesta.text();

        throw new Error(
          'Error HTTP ' +
          respuesta.status +
          ': ' +
          textoError
        );
      }

      return await respuesta.json();
    }

    // =========================================
    // PROCESAR PAGO
    // =========================================

    var procesandoPago = false;

    var reservaIda = null;

    var reservaVuelta = null;

    function bloquearBotones(bloquear) {

      [
        'btnPagarTarjeta',
        'btnPagarNequi',
        'btnPagarPSE'
      ].forEach(function (id) {

        var boton = elemento(id);

        if (boton) {
          boton.disabled = bloquear;
        }

      });
    }

    window.pagarYConfirmar = async function (mensaje) {

      if (procesandoPago) {
        return;
      }

      limpiarError();

      // Comprobar datos del viaje

      if (listaPax.length < numPax) {
        mostrarError(
          'Faltan los datos de los pasajeros. Regresa al paso anterior.'
        );
        return;
      }

      if (listaAsientos.length < numPax) {
        mostrarError(
          'Faltan asientos de ida. Regresa a seleccionar los asientos.'
        );
        return;
      }

      if (
        hayVuelta &&
        listaAsientosV.length < numPax
      ) {
        mostrarError(
          'Faltan asientos de vuelta. Regresa a seleccionar los asientos.'
        );
        return;
      }

      if (
        !Number.isFinite(totalNumero) ||
        totalNumero <= 0
      ) {
        mostrarError(
          'El total del pago no es válido.'
        );
        return;
      }

      // Validar según método

      if (
        metodoActual === 'tarjeta' &&
        !validarTarjeta()
      ) {
        return;
      }

      if (
        metodoActual === 'nequi' &&
        !validarNequi()
      ) {
        return;
      }

      if (
        metodoActual === 'pse' &&
        !validarPSE()
      ) {
        return;
      }

      procesandoPago = true;

      bloquearBotones(true);

      var loaderActivo = false;

      try {

        if (
          typeof UI !== 'undefined' &&
          typeof UI.mostrarLoader === 'function'
        ) {
          UI.mostrarLoader(
            mensaje || 'Procesando reserva...'
          );

          loaderActivo = true;
        }

        // Crear reserva de ida

        if (!reservaIda) {

          reservaIda = await crearReserva(
            viaje,
            claseBackend,
            totalIda,
            listaAsientos
          );

        }

        // Crear reserva de vuelta

        if (hayVuelta && !reservaVuelta) {

          reservaVuelta = await crearReserva(
            viajeV,
            claseBackendV,
            totalVuelta,
            listaAsientosV
          );

        }

        // =====================================
        // GUARDAR CONFIRMACIÓN
        // =====================================

        var confirmacion = {

          idReserva: reservaIda.idReserva,

          ruta:
            viaje.terminalOrigen +
            ' → ' +
            viaje.terminalDestino,

          fecha: fecha,

          hora: viaje.salida,

          asiento: asiento || '—',

          pasajero: nombrePasajero,

          pasajeros: nombres,

          asientos: listaAsientos,

          clase: claseNombre,

          total: total,

          metodoPago: metodoActual

        };

        if (hayVuelta) {

          confirmacion.vuelta = {

            idReserva: reservaVuelta.idReserva,

            ruta:
              viajeV.terminalOrigen +
              ' → ' +
              viajeV.terminalDestino,

            fecha: fechaV,

            hora: viajeV.salida,

            asiento: asientoV || '—',

            asientos: listaAsientosV,

            clase: claseNombreV,

            total: dinero(totalVuelta)

          };

        }

        sessionStorage.setItem(
          'concorde_confirmacion',
          JSON.stringify(confirmacion)
        );

        // =====================================
        // GUARDAR DATOS PARA MIS RESERVAS
        // =====================================

        var info = {};

        try {
          info = JSON.parse(
            localStorage.getItem(
              'concorde_reservas_info'
            ) || '{}'
          );
        } catch (error) {
          info = {};
        }

        info[reservaIda.idReserva] = {

          ruta:
            viaje.terminalOrigen +
            ' → ' +
            viaje.terminalDestino,

          fecha: fechaConAnio(viaje),

          clase: claseNombre,

          total: dinero(totalIda),

          tramo: hayVuelta ? 'Ida' : '',

          pasajeros: nombres,

          asientos: listaAsientos

        };

        if (hayVuelta) {

          info[reservaVuelta.idReserva] = {

            ruta:
              viajeV.terminalOrigen +
              ' → ' +
              viajeV.terminalDestino,

            fecha: fechaConAnio(viajeV),

            clase: claseNombreV,

            total: dinero(totalVuelta),

            tramo: 'Vuelta',

            pasajeros: nombres,

            asientos: listaAsientosV

          };

        }

        localStorage.setItem(
          'concorde_reservas_info',
          JSON.stringify(info)
        );

        // =====================================
        // IR A CONFIRMACIÓN
        // =====================================

        window.location.href =
          'p10-confirmacion.html';

      } catch (error) {

        console.error(
          'Error al guardar la reserva:',
          error
        );

        procesandoPago = false;

        bloquearBotones(false);

        if (
          loaderActivo &&
          typeof UI.ocultarLoader === 'function'
        ) {
          UI.ocultarLoader();
        }

        if (
          reservaIda &&
          hayVuelta &&
          !reservaVuelta
        ) {

          mostrarError(
            'La ida se guardó, pero la vuelta no. Puedes intentar completar la vuelta sin duplicar la ida.'
          );

        } else {

          mostrarError(
            'No se pudo guardar la reserva. ' +
            'Revisa que los asientos sigan disponibles. ' +
            error.message
          );

        }

      }

    };

    // =========================================
    // EVENTO BOTÓN TARJETA
    // =========================================

    elemento('formPago').addEventListener(
      'submit',
      function (evento) {

        evento.preventDefault();

        evento.stopPropagation();

        evento.stopImmediatePropagation();

        window.pagarYConfirmar(
          'Procesando pago de prueba...'
        );

      },
      true
    );

    // =========================================
    // EVENTO BOTÓN NEQUI
    // =========================================

    elemento('btnPagarNequi').addEventListener(
      'click',
      function () {

        window.pagarYConfirmar(
          'Procesando pago de prueba con Nequi / Daviplata...'
        );

      }
    );

    // =========================================
    // EVENTO BOTÓN PSE
    // =========================================

    elemento('btnPagarPSE').addEventListener(
      'click',
      function () {

        window.pagarYConfirmar(
          'Procesando transferencia de prueba...'
        );

      }
    );

    console.log(
      'Concorde: formulario de pago inicializado.'
    );

  })();
  </script>
