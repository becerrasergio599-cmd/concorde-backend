<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mis reservas - Concorde Transporte Terrestre">
  <title>Concorde Transporte Terrestre | Mis Reservas</title>
  <link rel="icon" type="image/png" href="img/LogoConcorde.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main id="contenido-principal" class="py-4">
    <div class="container">
      <section aria-label="Gestión de reservas"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="h4 fw-bold texto-azul mb-0">
          <i class="bi bi-calendar-check me-2" aria-hidden="true"></i>Mis Reservas
        </h1>
        <a href="index.html" class="btn btn-concorde-dorado">
          <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Nueva reserva
        </a>
      </div>

      <!-- Filtros rápidos -->
      <div class="mb-3 d-flex gap-2 flex-wrap" role="group" aria-label="Filtrar reservas por estado">
        <button class="btn btn-concorde-primario btn-sm" onclick="filtrarReservas('todas')" aria-pressed="true">Todas</button>
        <button class="btn btn-outline-concorde btn-sm" onclick="filtrarReservas('confirmado')">Confirmadas</button>
        <button class="btn btn-outline-concorde btn-sm" onclick="filtrarReservas('pendiente')">Pendientes</button>
        <button class="btn btn-outline-concorde btn-sm" onclick="filtrarReservas('cancelado')">Canceladas</button>
      </div>

      <!-- Tabla responsive -->
      <div class="tabla-concorde" role="region" aria-label="Listado de reservas">
        <table class="table mb-0" aria-label="Tabla de mis reservas">
          <thead>
            <tr>
              <th scope="col">Código</th>
              <th scope="col">Ruta</th>
              <th scope="col">Fecha</th>
              <th scope="col">Pasajero</th>
              <th scope="col">Estado</th>
              <th scope="col">Valor</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaReservas">
            <tr><td colspan="7" class="text-center text-muted py-4">Cargando tus reservas...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Sin reservas (oculto por defecto) -->
      <div id="sinReservas" class="text-center py-5 d-none">
        <div style="font-size:4rem" aria-hidden="true">✈️</div>
        <h2 class="h5 fw-bold texto-azul mt-3">No hay reservas en esta categoría</h2>
        <p class="text-muted">No tienes reservas con este estado.</p>
      </div>
    </div>
  </section>
  </main>
  <div id="footer-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      var u = Auth.getUsuario();
      if (!u) { window.location.href = 'p03-login.html'; return; }
      if (u.rol === 'administrador') { window.location.href = 'admin-panel.html'; }
    })();
  </script>
  <script src="js/componentes.js"></script><script src="js/main.js"></script>
  <script>
    const API = 'http://localhost:8082/api';

    const estadoInfo = {
      PENDIENTE:  { clase: 'estado-pendiente',  filtro: 'pendiente',  texto: 'Pendiente'  },
      CONFIRMADA: { clase: 'estado-confirmado', filtro: 'confirmado', texto: 'Confirmada' },
      CANCELADA:  { clase: 'estado-cancelado',  filtro: 'cancelado',  texto: 'Cancelada'  }
    };

    let misReservas = []; // guardamos las filas ya armadas para poder filtrar sin recargar

    async function cargarMisViajes() {
      const tbody = document.getElementById('tablaReservas');
      const usuario = Auth.getUsuario();

      try {
        const [reservas, viajes, rutas, terminales] = await Promise.all([
          fetch(`${API}/reservas`).then(r => r.json()),
          fetch(`${API}/viajes`).then(r => r.json()),
          fetch(`${API}/rutas`).then(r => r.json()),
          fetch(`${API}/terminales`).then(r => r.json())
        ]);

        const viajePorId = Object.fromEntries(viajes.map(v => [v.idViaje, v]));
        const rutaPorId = Object.fromEntries(rutas.map(r => [r.idRuta, r]));
        const terminalPorId = Object.fromEntries(terminales.map(t => [t.idTerminal, t]));

        const misPropias = reservas.filter(r => r.usuario && r.usuario.idUsuario === usuario.id);

        misReservas = misPropias.map(reserva => {
          const viaje = viajePorId[reserva.viaje.idViaje];
          const ruta = viaje ? rutaPorId[viaje.ruta.idRuta] : null;
          const origen = ruta ? terminalPorId[ruta.terminalOrigen.idTerminal] : null;
          const destino = ruta ? terminalPorId[ruta.terminalDestino.idTerminal] : null;
          const info = estadoInfo[reserva.estado] || estadoInfo.PENDIENTE;

          return {
            idReserva: reserva.idReserva,
            rutaTexto: origen && destino ? `${origen.ciudad} → ${destino.ciudad}` : 'Ruta no disponible',
            fechaTexto: viaje ? new Date(viaje.fechaViaje + 'T00:00:00').toLocaleDateString('es-CO', { day:'numeric', month:'short', year:'numeric' }) : '—',
            valorTexto: viaje ? '$' + Number(viaje.precio).toLocaleString('es-CO') : '—',
            estadoFiltro: info.filtro,
            estadoClase: info.clase,
            estadoTexto: info.texto,
            estadoCruda: reserva.estado
          };
        });

        renderTablaReservas(misReservas);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">
          No se pudo conectar con el servidor. Verifica que el backend esté corriendo en el puerto 8082.
        </td></tr>`;
      }
    }

    function renderTablaReservas(lista) {
      const tbody = document.getElementById('tablaReservas');
      const usuario = Auth.getUsuario();

      if (!lista.length) {
        tbody.innerHTML = '';
        document.getElementById('sinReservas').classList.remove('d-none');
        return;
      }
      document.getElementById('sinReservas').classList.add('d-none');

      tbody.innerHTML = lista.map(r => `
        <tr data-estado="${r.estadoFiltro}">
          <td data-label="Código"><strong>R-${r.idReserva}</strong></td>
          <td data-label="Ruta">${r.rutaTexto}</td>
          <td data-label="Fecha">${r.fechaTexto}</td>
          <td data-label="Pasajero">${usuario.nombre}</td>
          <td data-label="Estado"><span class="${r.estadoClase}">${r.estadoTexto}</span></td>
          <td data-label="Valor">${r.valorTexto}</td>
          <td data-label="Acciones">
            ${r.estadoCruda !== 'CANCELADA'
              ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelarReserva(${r.idReserva})" aria-label="Cancelar reserva R-${r.idReserva}">
                   <i class="bi bi-x-circle" aria-hidden="true"></i>
                 </button>`
              : '<span class="text-muted small">—</span>'}
          </td>
        </tr>
      `).join('');
    }

    async function cancelarReserva(idReserva) {
      if (!confirm('¿Cancelar esta reserva?')) return;
      const reserva = (await fetch(`${API}/reservas/${idReserva}`).then(r => r.json()));
      try {
        const res = await fetch(`${API}/reservas/${idReserva}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario: { idUsuario: reserva.usuario.idUsuario },
            viaje: { idViaje: reserva.viaje.idViaje },
            estado: 'CANCELADA'
          })
        });
        if (!res.ok) throw new Error('No se pudo cancelar');
        cargarMisViajes();
      } catch (e) {
        alert('No se pudo cancelar la reserva. Intenta de nuevo.');
      }
    }

    function filtrarReservas(estado) {
      const lista = estado === 'todas' ? misReservas : misReservas.filter(r => r.estadoFiltro === estado);
      renderTablaReservas(lista);
      document.querySelectorAll('[onclick^="filtrarReservas"]').forEach(btn => btn.setAttribute('aria-pressed', 'false'));
      if (typeof event !== 'undefined' && event.target) event.target.setAttribute('aria-pressed', 'true');
    }

    cargarMisViajes();
  </script>
</body>
</html>
