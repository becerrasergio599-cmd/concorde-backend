<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mi perfil - Concorde Transporte Terrestre">
  <title>Concorde Transporte Terrestre | Mi Perfil</title>
  <link rel="icon" type="image/png" href="img/LogoConcorde.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main id="contenido-principal" class="py-4">
    <div class="container">
      <h1 class="h4 fw-bold texto-azul mb-4">
        <i class="bi bi-person-circle me-2" aria-hidden="true"></i>Mi Perfil
      </h1>

      <div class="row g-4">
        <!-- Sidebar del perfil -->
        <div class="col-lg-3">
          <div class="card-concorde text-center p-4 mb-3">
            <div id="perfilAvatar" style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--azul-principal),var(--azul-claro));display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:2.5rem;color:white" aria-label="Avatar de usuario" role="img">
              --
            </div>
            <h2 class="h6 fw-bold mb-0" id="perfilNombreSidebar">Cargando…</h2>
            <p class="text-muted small mb-2" id="perfilEmailSidebar">—</p>
            <span class="badge-clase badge-premium" id="perfilBadge">Cliente</span>
          </div>
          <!-- Estadísticas -->
          <div class="card-concorde p-3">
            <h3 class="h6 fw-bold texto-azul mb-3">Mis estadísticas</h3>
            <div class="d-flex justify-content-between mb-2 small">
              <span class="text-muted">Reservas realizadas</span>
              <strong id="statReservasRealizadas">0</strong>
            </div>
            <div class="d-flex justify-content-between small">
              <span class="text-muted">Reservas activas</span>
              <strong class="texto-dorado" id="statReservasActivas">0</strong>
            </div>
          </div>
        </div>

        <!-- Formulario del perfil -->
        <div class="col-lg-9">
          <!-- Tabs de secciones -->
          <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabDatosPersonales" type="button" role="tab">
                <i class="bi bi-person me-1"></i>Datos Personales
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabSeguridad" type="button" role="tab">
                <i class="bi bi-lock me-1"></i>Seguridad
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabPreferencias" type="button" role="tab">
                <i class="bi bi-sliders me-1"></i>Preferencias
              </button>
            </li>
          </ul>

          <div class="tab-content">
            <!-- Datos personales -->
            <div class="tab-pane fade show active" id="tabDatosPersonales" role="tabpanel">
              <div class="card-concorde">
                <div class="card-header-concorde"><i class="bi bi-person-lines-fill me-2"></i>Información personal</div>
                <div class="card-body">
                  <form class="form-concorde" id="formPerfilDatos" novalidate>
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label" for="perfilNombreCompleto">Nombre completo</label>
                        <input type="text" class="form-control" id="perfilNombreCompleto" required autocomplete="name">
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="perfilEmail">Correo electrónico</label>
                        <input type="email" class="form-control" id="perfilEmail" required autocomplete="email">
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="perfilTelefono">Teléfono</label>
                        <input type="tel" class="form-control" id="perfilTelefono" autocomplete="tel">
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="perfilNumDoc">Número de documento</label>
                        <input type="text" class="form-control" id="perfilNumDoc" required>
                      </div>
                      <div class="col-12">
                        <button type="submit" class="btn btn-concorde-primario px-4">
                          <i class="bi bi-check-lg me-1"></i>Guardar cambios
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <!-- Seguridad -->
            <div class="tab-pane fade" id="tabSeguridad" role="tabpanel">
              <div class="card-concorde">
                <div class="card-header-concorde"><i class="bi bi-shield-lock me-2"></i>Cambiar contraseña</div>
                <div class="card-body">
                  <form class="form-concorde" id="formPerfilSeguridad" novalidate>
                    <div class="row g-3" style="max-width:480px">
                      <div class="col-12">
                        <label class="form-label" for="passActual">Contraseña actual</label>
                        <input type="password" class="form-control" id="passActual" required autocomplete="current-password">
                      </div>
                      <div class="col-12">
                        <label class="form-label" for="passNueva">Nueva contraseña</label>
                        <input type="password" class="form-control" id="passNueva" required minlength="8" autocomplete="new-password"
                          placeholder="Mín. 8, mayúscula, minúscula, número y símbolo">
                        <div class="mt-1" style="height:4px;border-radius:2px;background:var(--gris-medio)">
                          <div id="fortalezaFillPerfil" style="height:100%;border-radius:2px;width:0;transition:all 0.4s"></div>
                        </div>
                        <small id="fortalezaTextoPerfil" class="text-muted"></small>
                      </div>
                      <div class="col-12">
                        <label class="form-label" for="passConfirmar">Confirmar nueva contraseña</label>
                        <input type="password" class="form-control" id="passConfirmar" required autocomplete="new-password">
                      </div>
                      <div class="col-12">
                        <button type="submit" class="btn btn-concorde-primario px-4">
                          <i class="bi bi-shield-check me-1"></i>Actualizar contraseña
                        </button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <!-- Preferencias -->
            <div class="tab-pane fade" id="tabPreferencias" role="tabpanel">
              <div class="card-concorde">
                <div class="card-header-concorde"><i class="bi bi-sliders me-2"></i>Mis preferencias de viaje</div>
                <div class="card-body">
                  <div class="row g-4">
                    <div class="col-md-6">
                      <label class="form-label fw-bold" for="prefAsiento">Tipo de asiento preferido</label>
                      <select class="form-select" id="prefAsiento">
                        <option>Ventana</option>
                        <option>Pasillo</option>
                        <option>Centro</option>
                        <option>Sin preferencia</option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label fw-bold" for="prefComida">Preferencia alimentaria</label>
                      <select class="form-select" id="prefComida">
                        <option>Estándar</option>
                        <option>Vegetariano</option>
                        <option>Vegano</option>
                        <option>Sin gluten</option>
                        <option>Halal</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <label class="form-label fw-bold">Notificaciones</label>
                      <div class="row g-2">
                        <div class="col-md-6">
                          <div class="form-check form-switch">
                            <input class="form-abordajeput" type="checkbox" id="notifEmail" checked role="switch">
                            <label class="form-check-label" for="notifEmail">Correos sobre mis reservas</label>
                          </div>
                        </div>
                        <div class="col-md-6">
                          <div class="form-check form-switch">
                            <input class="form-abordajeput" type="checkbox" id="notifPromos" role="switch">
                            <label class="form-check-label" for="notifPromos">Promociones y ofertas</label>
                          </div>
                        </div>
                        <div class="col-md-6">
                          <div class="form-check form-switch">
                            <input class="form-abordajeput" type="checkbox" id="notifCheck" checked role="switch">
                            <label class="form-check-label" for="notifCheck">Abordaje disponible</label>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="col-12">
                      <button type="button" onclick="UI.mostrarToast('Preferencias guardadas','success')" class="btn btn-concorde-primario px-4">
                        <i class="bi bi-check-lg me-1"></i>Guardar preferencias
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/passwordPolicy.js"></script>
  <script>
    (function(){
      if (!Auth.estaLogueado()) { window.location.href = 'p03-login.html'; return; }
      var u = Auth.getUsuario();
      if (u && u.rol === 'administrador') { window.location.href = 'admin-panel.html'; }
      else if (u && u.rol === 'agente') { window.location.href = 'agente-panel.html'; }
    })();
  </script>
  <script src="js/componentes.js"></script><script src="js/main.js"></script>
  <script>
    // ═══════════════════════════════════════════════════════════
    // MI PERFIL — datos reales desde la API (tabla usuario), en
    // vez de los valores de ejemplo que traía la plantilla.
    // ═══════════════════════════════════════════════════════════
    const API_PERFIL = 'http://localhost:8082/api';
    let usuarioActual = null; // registro completo tal como está en la base de datos

    function inicialesDe(nombre) {
      return (nombre || '')
        .split(' ').filter(Boolean).slice(0, 2)
        .map(p => p[0].toUpperCase()).join('');
    }

    function pintarPerfil(u) {
      document.getElementById('perfilAvatar').textContent = inicialesDe(u.nombreCompleto);
      document.getElementById('perfilNombreSidebar').textContent = u.nombreCompleto || '—';
      document.getElementById('perfilEmailSidebar').textContent = u.correoElectronico || '—';
      document.getElementById('perfilBadge').textContent = u.creadoEn
        ? 'Cliente desde ' + new Date(u.creadoEn).toLocaleDateString('es-CO', { month: 'long', year: 'numeric' })
        : ((u.rol && u.rol.nombreRol) || 'Cliente');

      document.getElementById('perfilNombreCompleto').value = u.nombreCompleto || '';
      document.getElementById('perfilEmail').value = u.correoElectronico || '';
      document.getElementById('perfilTelefono').value = u.telefono || '';
      document.getElementById('perfilNumDoc').value = u.numeroDocumento || '';
    }

    async function cargarEstadisticas(idUsuario) {
      try {
        const reservas = await fetch(`${API_PERFIL}/reservas`).then(r => r.json());
        const mias = reservas.filter(r => r.usuario && r.usuario.idUsuario === idUsuario);
        document.getElementById('statReservasRealizadas').textContent = mias.length;
        const activas = mias.filter(r => r.estado === 'PENDIENTE' || r.estado === 'CONFIRMADA').length;
        document.getElementById('statReservasActivas').textContent = activas;
      } catch (e) {
        document.getElementById('statReservasRealizadas').textContent = '—';
        document.getElementById('statReservasActivas').textContent = '—';
      }
    }

    async function cargarPerfil() {
      const sesion = Auth.getUsuario();
      if (!sesion) return;
      try {
        const res = await fetch(`${API_PERFIL}/usuarios/${sesion.id}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        usuarioActual = await res.json();
        pintarPerfil(usuarioActual);
        cargarEstadisticas(sesion.id);
      } catch (e) {
        UI.mostrarToast('No se pudo cargar tu perfil. Verifica que el backend esté corriendo en el puerto 8082.', 'warning');
      }
    }

    async function guardarDatosPersonales() {
      const form = document.getElementById('formPerfilDatos');
      if (!form.reportValidity()) return;
      if (!usuarioActual) {
        UI.mostrarToast('Tu perfil aún no ha cargado, intenta de nuevo en un momento.', 'warning');
        return;
      }
      // El PUT de /api/usuarios sobrescribe el registro completo, así que
      // se reenvían la contraseña y el rol tal como están (no se editan aquí).
      const payload = {
        nombreCompleto: document.getElementById('perfilNombreCompleto').value,
        correoElectronico: document.getElementById('perfilEmail').value,
        telefono: document.getElementById('perfilTelefono').value,
        numeroDocumento: document.getElementById('perfilNumDoc').value,
        contrasenaHash: usuarioActual.contrasenaHash,
        rol: usuarioActual.rol ? { idRol: usuarioActual.rol.idRol } : null
      };
      const btn = form.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Guardando...';
      try {
        const res = await fetch(`${API_PERFIL}/usuarios/${usuarioActual.idUsuario}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || err.message || `HTTP ${res.status}`);
        }
        usuarioActual = await res.json();
        pintarPerfil(usuarioActual);

        // Refresca también la sesión guardada y la barra de navegación,
        // para que el nombre/avatar de arriba a la derecha queden al día.
        const sesion = Auth.getUsuario();
        if (sesion) {
          sesion.nombre = usuarioActual.nombreCompleto;
          sesion.email = usuarioActual.correoElectronico;
          sesion.avatar = inicialesDe(usuarioActual.nombreCompleto);
          sessionStorage.setItem('concorde_user', JSON.stringify(sesion));
          if (typeof inyectarNavbar === 'function') inyectarNavbar();
        }
        UI.mostrarToast('Tus datos se actualizaron correctamente', 'success');
      } catch (e) {
        UI.mostrarToast('Error al guardar: ' + e.message, 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    }

    async function guardarSeguridad() {
      const form = document.getElementById('formPerfilSeguridad');
      if (!form.reportValidity()) return;
      if (!usuarioActual) {
        UI.mostrarToast('Tu perfil aún no ha cargado, intenta de nuevo en un momento.', 'warning');
        return;
      }
      const passActual = document.getElementById('passActual').value;
      const passNueva = document.getElementById('passNueva').value;
      const passConfirmar = document.getElementById('passConfirmar').value;

      if (passActual !== usuarioActual.contrasenaHash) {
        UI.mostrarToast('La contraseña actual no es correcta', 'danger');
        return;
      }
      if (passNueva !== passConfirmar) {
        UI.mostrarToast('La nueva contraseña y su confirmación no coinciden', 'warning');
        return;
      }
      const politica = PasswordPolicy.validar(passNueva);
      if (!politica.valido) {
        UI.mostrarToast(politica.mensaje, 'warning');
        return;
      }

      const payload = {
        nombreCompleto: usuarioActual.nombreCompleto,
        correoElectronico: usuarioActual.correoElectronico,
        telefono: usuarioActual.telefono,
        numeroDocumento: usuarioActual.numeroDocumento,
        contrasenaHash: passNueva,
        rol: usuarioActual.rol ? { idRol: usuarioActual.rol.idRol } : null
      };
      try {
        const res = await fetch(`${API_PERFIL}/usuarios/${usuarioActual.idUsuario}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || err.message || `HTTP ${res.status}`);
        }
        usuarioActual = await res.json();
        form.reset();
        UI.mostrarToast('Contraseña actualizada correctamente', 'success');
      } catch (e) {
        UI.mostrarToast('Error: ' + e.message, 'danger');
      }
    }

    PasswordPolicy.conectarMedidor(
      document.getElementById('passNueva'),
      document.getElementById('fortalezaFillPerfil'),
      document.getElementById('fortalezaTextoPerfil')
    );

    // Se intercepta el submit en fase de captura sobre "document": así se
    // adelanta al manejador genérico de main.js (que solo simula el envío
    // y redirige) y se hace la petición real a la API antes de que ese
    // manejador entre a actuar sobre el mismo formulario.
    document.addEventListener('submit', function (e) {
      if (e.target && e.target.id === 'formPerfilDatos') {
        e.preventDefault();
        e.stopImmediatePropagation();
        guardarDatosPersonales();
      } else if (e.target && e.target.id === 'formPerfilSeguridad') {
        e.preventDefault();
        e.stopImmediatePropagation();
        guardarSeguridad();
      }
    }, true);

    document.addEventListener('DOMContentLoaded', cargarPerfil);
  </script>
</body>
</html>
