
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Resultados de búsqueda de tiquetes - Concorde Transporte Terrestre">
  <title>Concorde Transporte Terrestre | Resultados</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="navbar-placeholder"></div>

  <main id="contenido-principal">

    <div class="bg-azul-gradiente text-white py-3">
      <div class="container">
        <nav aria-label="Ruta de navegación">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
              <a href="index.html" class="text-white-50">Inicio</a>
            </li>
            <li class="breadcrumb-item active text-white" aria-current="page">
              Resultados
            </li>
          </ol>
        </nav>

        <h1 class="h4 mt-2 fw-bold">
          <i class="bi bi-search me-2" aria-hidden="true"></i>
          <span id="rutaBusqueda">Buscando trayectos...</span>
        </h1>
      </div>
    </div>

    <div class="container py-4">
      <div class="row g-3">

        <!-- FILTROS -->
        <aside class="col-lg-3" aria-label="Filtros de búsqueda">

          <div class="card-concorde mb-3">
            <div class="card-header-concorde">
              <i class="bi bi-funnel me-1"></i>Filtros
            </div>

            <div class="card-body">

              <fieldset class="mb-3">
                <legend class="form-label fw-bold">Precio máximo</legend>

                <input
                  type="range"
                  class="form-range"
                  min="10000"
                  max="150000"
                  step="5000"
                  value="150000"
                  id="filtroPrecio"
                  data-filtro
                >

                <div class="d-flex justify-content-between small text-muted">
                  <span>$10k</span>
                  <span id="valorPrecio" class="fw-bold texto-azul">$150k</span>
                  <span>$150k</span>
                </div>
              </fieldset>

              <fieldset class="mb-3">
                <legend class="form-label fw-bold">Hora de salida</legend>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno1" checked data-filtro>
                  <label class="form-check-label" for="turno1">🌅 Madrugada (00–06)</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno2" checked data-filtro>
                  <label class="form-check-label" for="turno2">☀️ Mañana (06–12)</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno3" checked data-filtro>
                  <label class="form-check-label" for="turno3">🌤️ Tarde (12–18)</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="turno4" checked data-filtro>
                  <label class="form-check-label" for="turno4">🌙 Noche (18–00)</label>
                </div>
              </fieldset>

              <fieldset>
                <legend class="form-label fw-bold">Tipo de servicio</legend>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="claseEconomica" checked data-filtro>
                  <label class="form-check-label" for="claseEconomica">Económico</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="clasePremium" checked data-filtro>
                  <label class="form-check-label" for="clasePremium">Premium</label>
                </div>
              </fieldset>

            </div>
          </div>

          <!-- MODIFICAR BÚSQUEDA -->
          <div class="card-concorde">
            <div class="card-header-concorde">
              <i class="bi bi-arrow-repeat me-1"></i>Modificar búsqueda
            </div>

            <div class="card-body">
              <div class="form-concorde">

                <label class="form-label" for="origenFiltro">Origen</label>
                <select class="form-select form-select-sm mb-2" id="origenFiltro">
                  <option value="TUNJA">Tunja</option>
                  <option value="SOGAMOSO">Sogamoso</option>
                  <option value="DUITAMA">Duitama</option>
                  <option value="PAIPA">Paipa</option>
                  <option value="YOPAL">Yopal</option>
                  <option value="AGUAZUL">Aguazul</option>
                </select>

                <label class="form-label" for="destinoFiltro">Destino</label>
                <select class="form-select form-select-sm mb-3" id="destinoFiltro">
                  <option value="BOGOTA SALITRE">Bogotá Salitre</option>
                  <option value="BOGOTA NORTE">Bogotá Norte</option>
                  <option value="BUCARAMANGA">Bucaramanga</option>
                  <option value="BARRANQUILLA">Barranquilla</option>
                  <option value="CARTAGENA">Cartagena</option>
                  <option value="CUCUTA">Cúcuta</option>
                  <option value="PAMPLONA">Pamplona</option>
                  <option value="ONZAGA">Onzaga</option>
                  <option value="AGUAZUL">Aguazul</option>
                  <option value="TUNJA">Tunja</option>
                </select>

                <button type="button" id="btnBuscar" class="btn btn-concorde-primario w-100 btn-sm">
                  <i class="bi bi-search me-1"></i>Buscar
                </button>

              </div>
            </div>
          </div>
        </aside>

        <!-- RESULTADOS -->
        <section class="col-lg-9" aria-label="Lista de trayectos disponibles">

          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

            <p class="mb-0 text-muted">
              <strong class="texto-azul" id="contador">0</strong>
              <span id="textoContador">trayectos encontrados</span>
            </p>

            <div class="d-flex align-items-center gap-2">
              <label for="ordenar" class="form-label mb-0 small fw-semibold">
                Ordenar por:
              </label>

              <select class="form-select form-select-sm" id="ordenar" style="width:auto">
                <option value="precioAsc">Precio (menor)</option>
                <option value="precioDesc">Precio (mayor)</option>
                <option value="duracion">Duración</option>
                <option value="salida">Salida más temprana</option>
              </select>
            </div>

          </div>

          <div id="listaViajes" aria-live="polite">
            <div class="text-center text-muted py-5">
              <div class="spinner-border" role="status"></div>
              <p class="mt-3" id="textoCarga">Cargando trayectos...</p>
            </div>
          </div>

        </section>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/main.js"></script>

  <script>
    "use strict";

    // =====================================================
    // CONFIGURACIÓN
    // =====================================================

    // Se conserva la ruta de API que utilizaba tu proyecto.
    // Si el backend está en otro dominio, esta URL debe cambiarse
    // por la dirección real del backend.
    const API_VIAJES = "/api/viajes";

    const params = new URLSearchParams(window.location.search);

    const origen = (params.get("origen") || "").trim();
    const destino = (params.get("destino") || "").trim();
    const fechaIda = params.get("ida") || "";

    const pasajeros =
      params.get("pasajeros") ||
      params.get("pasajeros_total") ||
      "1";

    let viajes = [];

    // =====================================================
    // UTILIDADES
    // =====================================================

    const $ = id => document.getElementById(id);

    const esc = valor => String(valor ?? "").replace(/[&<>"']/g, caracter => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[caracter]);

    const fmt = valor =>
      "$" + Number(valor || 0).toLocaleString("es-CO");

    const sinTildes = texto =>
      String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toUpperCase();

    const capitalizar = texto =>
      String(texto || "")
        .toLowerCase()
        .replace(/(^|\s)\S/g, letra => letra.toUpperCase());

    const MESES = [
      "ene", "feb", "mar", "abr", "may", "jun",
      "jul", "ago", "sep", "oct", "nov", "dic"
    ];

    function fechaCorta(fecha) {
      const coincidencia = /^(\d{4})-(\d{2})-(\d{2})/.exec(fecha || "");

      if (!coincidencia) return "";

      const mes = parseInt(coincidencia[2], 10) - 1;

      return parseInt(coincidencia[3], 10) +
        " de " + (MESES[mes] || "");
    }

    // =====================================================
    // IDENTIFICADOR DEL VIAJE
    // =====================================================

    function idDe(viaje) {
      if (!viaje || typeof viaje !== "object") {
        return null;
      }

      const posiblesIds = [
        viaje.idViaje,
        viaje.id,
        viaje.id_viaje
      ];

      for (const valor of posiblesIds) {
        if (valor === null || valor === undefined) continue;

        const id = String(valor).trim();

        if (
          id !== "" &&
          id.toLowerCase() !== "undefined" &&
          id.toLowerCase() !== "null"
        ) {
          return id;
        }
      }

      console.error("Viaje sin identificador válido:", viaje);
      return null;
    }

    // =====================================================
    // DURACIÓN
    // =====================================================

    function duracionAMinutos(viaje) {
      if (Number.isFinite(Number(viaje.duracionMinutos))) {
        return Number(viaje.duracionMinutos);
      }

      const texto = String(viaje.duracion || "");

      const horas = texto.match(/(\d+)\s*h/i);
      const minutos = texto.match(/(\d+)\s*min/i);

      return (horas ? Number(horas[1]) * 60 : 0) +
        (minutos ? Number(minutos[1]) : 0);
    }

    // =====================================================
    // TURNOS
    // =====================================================

    function turnoDe(hora) {
      const horas = parseInt(String(hora || "").split(":")[0], 10);

      if (Number.isNaN(horas)) return 0;
      if (horas < 6) return 1;
      if (horas < 12) return 2;
      if (horas < 18) return 3;

      return 4;
    }

    // =====================================================
    // SELECTS Y ENCABEZADO
    // =====================================================

    function asignarSelect(select, valor) {
      if (!select || !valor) return;

      const normalizado = sinTildes(valor);

      let opcion = [...select.options].find(item =>
        sinTildes(item.value) === normalizado ||
        sinTildes(item.text) === normalizado
      );

      if (!opcion) {
        opcion = new Option(capitalizar(valor), valor);
        select.add(opcion);
      }

      select.value = opcion.value;
    }

    asignarSelect($("origenFiltro"), origen);
    asignarSelect($("destinoFiltro"), destino);

    $("rutaBusqueda").textContent =
      (capitalizar(origen) || "Origen") +
      " → " +
      (capitalizar(destino) || "Destino") +
      (fechaIda ? " · " + fechaCorta(fechaIda) : "") +
      " · " + pasajeros +
      (Number(pasajeros) === 1 ? " pasajero" : " pasajeros");

    // =====================================================
    // MENSAJES
    // =====================================================

    function mostrarError(mensaje) {
      $("listaViajes").innerHTML = `
        <div class="alert alert-danger" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          ${esc(mensaje)}
          <div class="mt-3">
            <button type="button" class="btn btn-outline-danger btn-sm"
              onclick="cargarViajes()">
              <i class="bi bi-arrow-clockwise me-1"></i>
              Intentar nuevamente
            </button>
          </div>
        </div>
      `;

      $("contador").textContent = "0";
      $("textoContador").textContent = "trayectos encontrados";
    }

    function mostrarAdvertencia(mensaje) {
      $("listaViajes").innerHTML = `
        <div class="alert alert-warning" role="alert">
          <i class="bi bi-info-circle me-2"></i>
          ${esc(mensaje)}
          <div class="mt-2">
            <a href="index.html" class="alert-link">
              Volver al inicio
            </a>
          </div>
        </div>
      `;

      $("contador").textContent = "0";
    }

    // =====================================================
    // MODIFICAR BÚSQUEDA
    // =====================================================

    $("btnBuscar").addEventListener("click", () => {
      const nuevoOrigen = $("origenFiltro").value;
      const nuevoDestino = $("destinoFiltro").value;

      if (!nuevoOrigen || !nuevoDestino) {
        alert("Selecciona un origen y un destino.");
        return;
      }

      if (sinTildes(nuevoOrigen) === sinTildes(nuevoDestino)) {
        alert("El origen y el destino no pueden ser iguales.");
        return;
      }

      const nuevosParametros = new URLSearchParams(
        window.location.search
      );

      nuevosParametros.delete("idViaje");
      nuevosParametros.set("origen", nuevoOrigen);
      nuevosParametros.set("destino", nuevoDestino);

      window.location.href =
        "p02-resultados.html?" + nuevosParametros.toString();
    });

    // =====================================================
    // CARGAR VIAJES DESDE EL BACKEND
    // =====================================================

    async function cargarViajes() {
      const lista = $("listaViajes");

      if (!origen || !destino) {
        mostrarAdvertencia(
          "No recibimos el origen y el destino. " +
          "Regresa al inicio y realiza una búsqueda de trayectos."
        );
        return;
      }

      if (sinTildes(origen) === sinTildes(destino)) {
        mostrarAdvertencia(
          "El origen y el destino no pueden ser iguales."
        );
        return;
      }

      lista.innerHTML = `
        <div class="text-center text-muted py-5">
          <div class="spinner-border" role="status"></div>
          <p class="mt-3" id="textoCarga">
            Consultando trayectos disponibles...
          </p>
        </div>
      `;

      const controlador = new AbortController();

      const temporizador = setTimeout(() => {
        controlador.abort();
      }, 90000);

      const avisoLento = setTimeout(() => {
        const texto = $("textoCarga");

        if (texto) {
          texto.textContent =
            "El servidor está tardando en responder. Espera un momento...";
        }
      }, 6000);

      try {
        const consulta = new URLSearchParams();

        consulta.set("origen", origen);
        consulta.set("destino", destino);

        if (fechaIda) {
          consulta.set("fecha", fechaIda);
        }

        const url = API_VIAJES + "?" + consulta.toString();

        console.log("Consultando API:", url);

        const respuesta = await fetch(url, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          },
          credentials: "same-origin",
          signal: controlador.signal
        });

        console.log("Estado de respuesta:", respuesta.status);

        if (respuesta.status === 401) {
          throw new Error(
            "401: Tu sesión no está autenticada. Inicia sesión nuevamente."
          );
        }

        if (respuesta.status === 403) {
          throw new Error(
            "403: El servidor rechazó la consulta de viajes. " +
            "Es necesario revisar los permisos del backend."
          );
        }

        if (respuesta.status === 404) {
          throw new Error(
            "404: No se encontró la ruta de la API de viajes."
          );
        }

        if (!respuesta.ok) {
          throw new Error("HTTP " + respuesta.status);
        }

        const datos = await respuesta.json();

        console.log("Respuesta de la API:", datos);

        if (Array.isArray(datos)) {
          viajes = datos;
        } else if (Array.isArray(datos.content)) {
          viajes = datos.content;
        } else if (Array.isArray(datos.viajes)) {
          viajes = datos.viajes;
        } else if (Array.isArray(datos.data)) {
          viajes = datos.data;
        } else {
          throw new Error(
            "La respuesta del servidor no contiene una lista de viajes válida."
          );
        }

        console.log("Viajes recibidos:", viajes);

        aplicarFiltros();

      } catch (error) {
        console.error("Error al cargar viajes:", error);

        if (error.name === "AbortError") {
          mostrarError(
            "El servidor tardó demasiado en responder. Intenta nuevamente."
          );
        } else {
          mostrarError(error.message || "No se pudieron cargar los viajes.");
        }

      } finally {
        clearTimeout(temporizador);
        clearTimeout(avisoLento);
      }
    }

    // =====================================================
    // FILTRAR Y ORDENAR
    // =====================================================

    function aplicarFiltros() {
      const precioMaximo = Number($("filtroPrecio").value);

      const turnos = {
        1: $("turno1").checked,
        2: $("turno2").checked,
        3: $("turno3").checked,
        4: $("turno4").checked
      };

      const economico = $("claseEconomica").checked;
      const premium = $("clasePremium").checked;

      let resultados = viajes.filter(viaje => {
        const tipo = String(
          viaje.tipoServicio || "ECONOMICO"
        ).trim().toUpperCase();

        const esPremium = tipo === "PREMIUM";

        const precio = Number(viaje.precio);

        const precioValido =
          Number.isNaN(precio) || precio <= precioMaximo;

        const turno = turnoDe(viaje.horaSalida);

        const turnoValido = turno > 0 && turnos[turno];

        const servicioValido = esPremium
          ? premium
          : economico;

        return precioValido && turnoValido && servicioValido;
      });

      const orden = $("ordenar").value;

      resultados.sort((a, b) => {
        if (orden === "precioAsc") {
          return Number(a.precio || 0) - Number(b.precio || 0);
        }

        if (orden === "precioDesc") {
          return Number(b.precio || 0) - Number(a.precio || 0);
        }

        if (orden === "duracion") {
          return duracionAMinutos(a) - duracionAMinutos(b);
        }

        return String(a.horaSalida || "")
          .localeCompare(String(b.horaSalida || ""));
      });

      pintarViajes(resultados);
    }

    // =====================================================
    // CONSTRUIR URL DE P05
    // =====================================================

    function urlSeleccionar(viaje) {
      const id = idDe(viaje);

      if (id === null) {
        return null;
      }

      const parametros = new URLSearchParams(
        window.location.search
      );

      parametros.set("idViaje", id);

      const url =
        "p05-detalle-viaje.html?" + parametros.toString();

      console.log("URL de selección:", url);

      return url;
    }

    // =====================================================
    // PINTAR RESULTADOS
    // =====================================================

    function pintarViajes(resultados) {
      const contenedor = $("listaViajes");

      $("contador").textContent = resultados.length;

      $("textoContador").textContent =
        resultados.length === 1
          ? "trayecto encontrado"
          : "trayectos encontrados";

      if (resultados.length === 0) {
        contenedor.innerHTML = `
          <div class="card-concorde">
            <div class="card-body text-center py-5">
              <div style="font-size:2.5rem">🚌</div>
              <h2 class="h5 mt-2">No encontramos trayectos</h2>
              <p class="text-muted mb-0">
                Prueba con otra fecha, otra ciudad o ajusta los filtros.
              </p>
            </div>
          </div>
        `;
        return;
      }

      contenedor.innerHTML = resultados.map(viaje => {
        const tipo = String(
          viaje.tipoServicio || "ECONOMICO"
        ).trim().toUpperCase();

        const esPremium = tipo === "PREMIUM";

        const insignia = esPremium
          ? '<span class="badge-clase badge-ejecutiva">Premium</span>'
          : '<span class="badge-clase badge-economica">Económico</span>';

        const paradas = viaje.paradas
          ? esc(viaje.paradas)
          : "Directo";

        const precio = fmt(viaje.precio);

        const tieneAsientos =
          viaje.asientosDisponibles !== undefined &&
          viaje.asientosDisponibles !== null;

        const agotado = tieneAsientos &&
          Number(viaje.asientosDisponibles) <= 0;

        const asientos = tieneAsientos
          ? `<div class="small text-muted mb-2">
               Asientos disponibles: ${esc(viaje.asientosDisponibles)}
             </div>`
          : "";

        const url = urlSeleccionar(viaje);

        let boton = "";

        if (agotado) {
          boton = `
            <button class="btn btn-secondary btn-sm px-3" disabled>
              Agotado
            </button>
          `;
        } else if (!url) {
          boton = `
            <button class="btn btn-secondary btn-sm px-3" disabled
              title="Este viaje no tiene un identificador válido">
              No disponible
            </button>
          `;
        } else {
          boton = `
            <a href="${esc(url)}"
              class="btn btn-concorde-primario btn-sm px-3">
              Seleccionar
            </a>
          `;
        }

        return `
          <article class="card-vuelo fade-in-up mb-3"
            aria-label="Bus a las ${esc(viaje.horaSalida)}, precio ${esc(precio)}">

            <div class="row align-items-center g-2">

              <div class="col-md-3">
                <div class="hora">${esc(viaje.horaSalida || "--:--")}</div>

                <div class="ciudad">
                  ${esc(viaje.ciudadOrigen || origen)}
                  ${viaje.terminalOrigen
                    ? " · " + esc(viaje.terminalOrigen)
                    : ""}
                </div>

                <div class="small text-muted">
                  Bus 🚌 ${esc(viaje.tipoBus || "")}
                </div>
              </div>

              <div class="col-md-3 text-center">
                <div class="linea-vuelo justify-content-center"
                  aria-hidden="true">
                  <span class="avion-icono">🚌</span>
                </div>

                <small class="text-muted d-block">
                  ${esc(viaje.duracion || "")} · ${paradas}
                </small>

                ${insignia}
              </div>

              <div class="col-md-3">
                <div class="hora">
                  ${esc(viaje.horaLlegada || "--:--")}
                </div>

                <div class="ciudad">
                  ${esc(viaje.ciudadDestino || destino)}
                </div>

                <div class="small text-muted">
                  ${esc(viaje.terminalDestino || "")}
                </div>
              </div>

              <div class="col-md-3 text-end">
                <div class="precio">
                  ${esc(precio)}
                  <small>/persona</small>
                </div>

                ${asientos}

                ${boton}
              </div>

            </div>
          </article>
        `;
      }).join("");
    }

    // =====================================================
    // EVENTOS DE FILTROS
    // =====================================================

    const slider = $("filtroPrecio");

    slider.addEventListener("input", () => {
      $("valorPrecio").textContent =
        "$" + (Number(slider.value) / 1000) + "k";

      aplicarFiltros();
    });

    document.querySelectorAll(
      'input[data-filtro][type="checkbox"]'
    ).forEach(elemento => {
      elemento.addEventListener("change", aplicarFiltros);
    });

    $("ordenar").addEventListener("change", aplicarFiltros);

    // =====================================================
    // INICIAR
    // =====================================================

    cargarViajes();

  </script>
