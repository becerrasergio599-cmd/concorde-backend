<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mensaje enviado - Concorde Transporte Terrestre">
  <title>Concorde Transporte Terrestre | Mensaje Enviado</title>
  <link rel="icon" type="image/png" href="img/LogoConcorde.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main id="contenido-principal" class="py-5">
    <div class="container">
      <section aria-label="Confirmación de mensaje enviado"><div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 text-center">
          <div class="card-concorde p-5">
            <div class="icono-exito" aria-hidden="true">✉</div>
            <h1 class="h3 fw-bold texto-azul mb-3">¡Mensaje Enviado!</h1>
            <p class="text-muted mb-4">Nuestro equipo te contactará en un máximo de <strong>24 horas hábiles</strong>.</p>

            <div class="alerta-info alerta-concorde text-start mb-4" role="status" aria-live="polite">
              <i class="bi bi-info-circle me-2" aria-hidden="true"></i>
              Número de ticket: <strong id="numeroTicket">#SOC-20250102-481</strong>
              <button type="button" onclick="copiarTicket()" class="btn btn-sm btn-outline-primary ms-2" aria-label="Copiar número de ticket">
                <i class="bi bi-clipboard" aria-hidden="true"></i>
              </button>
            </div>

            <!-- Estado en tiempo real (simulado) -->
            <div class="card-concorde p-3 mb-4 text-start">
              <h2 class="h6 fw-bold mb-3"><i class="bi bi-clock me-2" aria-hidden="true"></i>Estado de tu solicitud</h2>
              <div class="d-flex flex-column gap-2" id="estadoSolicitud" aria-live="polite">
                <div class="d-flex align-items-center gap-2">
                  <span class="badge bg-success rounded-circle p-2" aria-hidden="true">✓</span>
                  <span class="small">Mensaje recibido</span>
                  <span class="text-muted small ms-auto">Ahora</span>
                </div>
                <div class="d-flex align-items-center gap-2" id="estadoAsignado">
                  <span class="spinner-border spinner-border-sm text-primary" role="status" aria-label="Procesando"></span>
                  <span class="small text-muted">Asignando agente...</span>
                </div>
              </div>
            </div>

            <!-- Encuesta rápida -->
            <div class="mb-4">
              <p class="small fw-bold mb-2">¿Encontraste fácil el proceso de contacto?</p>
              <div class="d-flex justify-content-center gap-2" role="group" aria-label="Valorar proceso de contacto">
                <button type="button" onclick="valorar('si')" class="btn btn-outline-success btn-sm" id="btnSi">
                  <i class="bi bi-hand-thumbs-up me-1" aria-hidden="true"></i>Sí
                </button>
                <button type="button" onclick="valorar('no')" class="btn btn-outline-danger btn-sm" id="btnNo">
                  <i class="bi bi-hand-thumbs-down me-1" aria-hidden="true"></i>No
                </button>
              </div>
              <div id="respuestaValorar" class="small text-muted mt-2" aria-live="polite"></div>
            </div>

            <div class="d-flex gap-3 justify-content-center flex-wrap">
              <a href="index.html" class="btn btn-concorde-primario px-4"><i class="bi bi-house me-1" aria-hidden="true"></i>Ir al inicio</a>
              <a href="p12-atencion.html" class="btn btn-outline-concorde px-4"><i class="bi bi-headset me-1" aria-hidden="true"></i>Volver a Atención</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  </main>
  <div id="footer-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/componentes.js"></script><script src="js/main.js"></script>
  <script>
    // Simular asignación de agente
    setTimeout(() => {
      const div = document.getElementById('estadoAsignado');
      div.innerHTML = `
        <span class="badge bg-success rounded-circle p-2" aria-hidden="true">✓</span>
        <span class="small">Agente asignado: <strong>María González</strong></span>
        <span class="text-muted small ms-auto">Hace 1 min</span>`;
      UI.mostrarToast('Un agente ha sido asignado a tu caso', 'success');
    }, 3000);

    function copiarTicket() {
      const ticket = document.getElementById('numeroTicket').textContent;
      navigator.clipboard?.writeText(ticket).then(() => UI.mostrarToast('Número de ticket copiado', 'success'))
        .catch(() => UI.mostrarToast('Ticket: ' + ticket, 'info'));
    }

    function valorar(resp) {
      document.getElementById('btnSi').disabled = true;
      document.getElementById('btnNo').disabled = true;
      const msg = resp === 'si' ? '¡Gracias! Nos alegra que fue sencillo.' : '¡Gracias! Trabajaremos para mejorar.';
      document.getElementById('respuestaValorar').textContent = msg;
    }
  </script>
</body>
</html>
